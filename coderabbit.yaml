# .coderabbit.yaml - ملف الإعدادات مع جميع الصلاحيات
language: "en-US"
early_access: true

chat:
  auto_reply: true

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  sequence_diagrams: true
  changed_files_summary: true
  auto_review:
    enabled: true
    drafts: true
    base_branches:
      - "main"
      - "master"
      - "develop"
      - "release/*"
      - "hotfix/*"
  path_filters:
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/out/**"
    - "!**/.next/**"
    - "!**/*.lock"
    - "!**/*.min.js"
    - "!**/coverage/**"
  path_instructions:
    - path: "**/*.js"
      instructions: |
        JavaScript specific reviews:
        - Avoid using 'var', prefer 'const' and 'let'.
        - Ensure try-catch blocks are used for asynchronous operations.
    - path: "**/*.py"
      instructions: |
        Python specific reviews:
        - Ensure type hints are used for function parameters and return values.
        - Check for proper exception handling.
  tools:
    enabled: true
    github-checks:
      timeout_ms: 900000

pre_merge_checks:
  description:
    mode: "error"
  docstrings:
    mode: "off"
  test_coverage:
    mode: "off"
