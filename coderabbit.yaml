# إعدادات مراجعة CodeRabbit الشاملة والكاملة لمستودع WorldMondial
language: "ar" # تقديم التقارير والحلول باللغة العربية

reviews:
  profile: "assertive" # النمط الحازم: تدقيق صارم وعميق لكل التفاصيل
  auto_review:
    enabled: true 
    drafts: true # فحص الكود فوراً حتى لو كان المسودة (Draft)
  high_level_summary: true # ملخص شامل لكل الأخطاء المكتشفة وطرق حلها

  # تفعيل كافة أدوات الفحص المتاحة لأقصى دقة
  tools:
    ast: true # فحص البنية المنطقية للكود
    security: true # فحص الثغرات الأمنية والحماية
    linters: true # فحص نظافة وترتيب الكود ومعايير الجودة

  # إلغاء أي فلترة أو استثناءات لضمان فحص كل ملف في المستودع
  path_filters:
    - "**/*" # فحص كافة المجلدات والملفات بلا استثناء

  # التوجيهات النهائية للذكاء الاصطناعي للفحص الشامل وإصلاح المشاكل
  instructions: |
    لديك الصلاحية الكاملة والشاملة لفحص كل ملف داخل هذا المستودع دون أي استثناء. 
    يرجى مراجعة كود Kotlin، ملفات الـ XML الخاصة بالواجهات، ملفات بناء المشروع (Gradle build scripts)، وملفات الإعدادات.
    عند المراجعة، التزم بالآتي بدقة:
    1. اكتشاف كافة أخطاء النظام، ومشاكل الأداء، وتسريبات الذاكرة، والثغرات الأمنية.
    2. التحقق من سلامة معالجة البيانات واستقرار التطبيق ضد الانهيار (Crashes).
    3. التدقيق في معايير الجودة المتبعة وتناسق الكود.
    4. **إلزامية تقديم الحل**: عند العثور على أي مشكلة أو خطأ أو فرصة لتحسين الأداء، لا تكتفِ بالوصف، بل **يجب تقديم الكود البديل والمُصلح بالكامل** كـ (GitHub Suggestion) ليتمكن المطور من تطبيقه بضغطة زر واحدة.

# تفعيل المحادثة التفاعلية لمناقشة الحلول المباشرة داخل الـ Pull Request
chat:
  enabled: true
