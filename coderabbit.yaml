# إعدادات مراجعة CodeRabbit الشاملة لمستودع WorldMondial
language: "ar" # طلب كتابة الشرح والحلول باللغة العربية

reviews:
  profile: "assertive" # النمط الحازم: يدقق في كل صغيرة وكبيرة ولا يتغاضى عن الأخطاء
  auto_review:
    enabled: true 
    drafts: true # مراجعة حتى المسودات لاكتشاف الأخطاء مبكرًا أثناء العمل
  high_level_summary: true # تقديم ملخص شامل للأخطاء المكتشفة

  # تفعيل الفحص العميق والشامل لجميع جوانب الكود
  tools:
    ast: true # فحص بنية الكود الشجرية لاكتشاف الأخطاء المنطقية
    security: true # فحص الثغرات الأمنية ومشاكل الحماية
    linters: true # التدقيق في نظافة وترتيب الكود ومخالفة معايير الجودة

  # توجيهات صارمة للذكاء الاصطناعي لفحص وحل المشاكل
  instructions: |
    لديك الصلاحية الكاملة لتشريح الكود واكتشاف كافة أنواع المشاكل. هذا المشروع يعتمد على Kotlin.
    يرجى الالتزام بالآتي عند مراجعة أي سطر كود:
    1. ابحث عن أي ثغرات أمنية، تسريب للذاكرة (Memory Leaks)، أو استهلاك غير كفء لموارد النظام.
    2. تحقق من معالجة الاستثناءات (Exception Handling) وتأكد من عدم وجود ثغرات قد تؤدي لانهيار التطبيق (Crashes).
    3. افحص جودة كود Kotlin وتأكد من استغلال ميزاتها بالشكل الأمثل (Null Safety, Coroutines, Scope Functions).
    4. عند العثور على أي خطأ أو مشكلة، لا تكتفِ بالإشارة إليها بل **يجب عليك تقديم الحل البرمجي الكامل والمصلح للكود فوراً** بصيغة اقتراح قابل للتطبيق بضغطة زر (GitHub Suggestion).

# تفعيل الـ Chat بشكل كامل للنقاش حول الحلول المقترحة
chat:
  enabled: true
