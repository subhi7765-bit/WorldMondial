# إعدادات مراجعة CodeRabbit لمستودع WorldMondial
language: "ar" # توجيه الروبوت لكتابة ملخصات المراجعة باللغة العربية إن أمكن

reviews:
  profile: "chill" # نمط مراجعة متزن وغير مزعج
  auto_review:
    enabled: true # تفعيل المراجعة التلقائية فور فتح أي Pull Request
    drafts: false # عدم مراجعة مسودات الـ Pull Requests حتى تجهز تمامًا
  high_level_summary: true # إنشاء ملخص شامل وعالي المستوى للتغييرات

  # توجيهات مخصصة للذكاء الاصطناعي تركز على كود مشروعك
  instructions: |
    هذا المشروع مكتوب بلغة Kotlin بنسبة 100%. عند مراجعة الكود، يرجى التركيز على:
    1. التأكد من كفاءة كود Kotlin واتباعه للممارسات القياسية (Best Practices).
    2. فحص إدارة الذاكرة، وبنية الـ Coroutines إن وُجدت.
    3. التحقق من سلامة البنية التحتية للمشروع (clean architecture / modular code) الموزعة بين مجلدات app و core و feature.

# إعدادات الـ Chat التفاعلي داخل الـ Pull Request
chat:
  enabled: true
