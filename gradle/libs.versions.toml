[versions]
kotlin               = "2.0.21"
compose              = "1.7.5"
material3            = "1.3.1"
room                 = "2.7.1"
hilt                 = "2.55"
paging               = "3.3.2"
androidGradlePlugin  = "8.7.2"
ksp                  = "2.0.21-1.0.26"
kotlinxSerialization = "1.6.3"
androidxNavigation   = "2.8.4"
timber               = "5.0.1"
okhttp               = "4.12.0"
retrofit             = "2.11.0"
lifecycle            = "2.8.7"
datastore            = "1.1.1"
coil                 = "2.6.0"
junit                = "4.13.2"
mockk                = "1.13.10"
turbine              = "1.1.0"
work                 = "2.9.1"
androidxTest         = "1.6.1"

[libraries]
# Jetpack Compose Presentation Core Libraries
androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui",                              version.ref = "compose" }
androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3",                       version.ref = "material3" }
androidx-navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",              version.ref = "androidxNavigation" }
material-icons-extended              = { group = "androidx.compose.material",  name = "material-icons-extended",         version.ref = "compose" }

# Architecture Infrastructure Components
kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",      version.ref = "kotlinxSerialization" }
timber                               = { group = "com.jakewharton.timber",      name = "timber",                          version.ref = "timber" }
androidx-appcompat                   = { group = "androidx.appcompat",          name = "appcompat",                       version = "1.7.0" }

# Jetpack Lifecycle Scope & Architecture Presentation Compositions (Optimized flat structure for Gradle 8.9)
lifecycle-viewmodel-compose          = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",     version.ref = "lifecycle" }
lifecycle-runtime-compose            = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",       version.ref = "lifecycle" }

# Dagger-Hilt Dependency Injection Ecosystem
hilt-android                         = { group = "com.google.dagger",           name = "hilt-android",                    version.ref = "hilt" }
hilt-compiler                        = { group = "com.google.dagger",           name = "hilt-compiler",                   version.ref = "hilt" }
androidx-hilt-navigation-compose     = { group = "androidx.hilt",               name = "hilt-navigation-compose",         version = "1.2.0" }

# Kotlin Multi-threaded Async Coroutines Execution
kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",      version = "1.9.0" }
kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",         version = "1.9.0" }
kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",         version = "1.9.0" }

# Type-Safe REST Remote Network Layer Client
retrofit-core                        = { group = "com.squareup.retrofit2",      name = "retrofit",                        version.ref = "retrofit" }
retrofit-kotlinx-serialization       = { group = "com.squareup.retrofit2",      name = "converter-kotlinx-serialization", version.ref = "retrofit" }
okhttp-logging                       = { group = "com.squareup.okhttp3",        name = "logging-interceptor",             version.ref = "okhttp" }

# SQLite Room Local Caching Layer Database
room-runtime                         = { group = "androidx.room",               name = "room-runtime",                    version.ref = "room" }
room-ktx                             = { group = "androidx.room",               name = "room-ktx",                        version.ref = "room" }
room-compiler                        = { group = "androidx.room",               name = "room-compiler",                   version.ref = "room" }

# Pagination Data Flow & Asynchronous Preferences Storage
androidx-datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",           version.ref = "datastore" }
coil-compose                         = { group = "io.coil-kt",                  name = "coil-compose",                    version.ref = "coil" }
androidx-paging-runtime              = { group = "androidx.paging",             name = "paging-runtime",                  version.ref = "paging" }
androidx-paging-compose              = { group = "androidx.paging",             name = "paging-compose",                  version.ref = "paging" }

# Explicit Dot-nested mapping structure definition optimized for strict Gradle verification engines
androidx-work-runtime                = { group = "androidx.work",               name = "work-runtime-ktx",                version.ref = "work" }

# Unified Testing Architecture Libraries
junit                                = { group = "junit",                       name = "junit",                           version.ref = "junit" }
mockk                                = { group = "io.mockk",                    name = "mockk",                           version.ref = "mockk" }
turbine                              = { group = "app.cash.turbine",            name = "turbine",                         version.ref = "turbine" }

# AndroidX Native Instrumentation Test Architecture Frameworks
androidx-test-core                   = { group = "androidx.test",               name = "core",                            version.ref = "androidxTest" }
androidx-test-rules                  = { group = "androidx.test",               name = "rules",                           version.ref = "androidxTest" }
androidx-test-runner                 = { group = "androidx.test",               name = "runner",                          version.ref = "androidxTest" }

[plugins]
google-services      = { id = "com.google.gms.google-services",            version = "4.4.2" }
android-application  = { id = "com.android.application",                   version.ref = "androidGradlePlugin" }
android-library      = { id = "com.android.library",                       version.ref = "androidGradlePlugin" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt" }
