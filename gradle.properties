# ==============================================================================
# Jetpack AndroidX Migration & Library Translation Layers
# ==============================================================================
android.useAndroidX=true
android.enableJetifier=true

# ==============================================================================
# Gradle Build Daemon Memory Allocation & Compiler Performance Tuning
# ==============================================================================
# Explicitly provisions 4GB of JVM heap space and 1GB of Metaspace capacity 
# to keep heavy code processors like Hilt, KSP, and Room compilation stable on remote CI runners.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+UseG1GC

# Disables long-running backgrounds daemons to save container memory resources on continuous integration hosts.
org.gradle.daemon=false

# Allows Gradle to execute decoupled subproject tasks in parallel where dependencies permit.
org.gradle.parallel=true

# Enables the caching of calculated configuration layouts to speed up consecutive pipeline compilation loops.
org.gradle.configuration-cache=true

# ==============================================================================
# Kotlin Compiler Verification Enforcement
# ==============================================================================
# Relaxes strict JVM target check crashes to warnings for non-critical code paths.
kotlin.jvm.target.validation.mode=WARNING
