          sp.run(f"wget -q https://services.gradle.org/distributions/gradle-{GRADLE_VER}-bin.zip -P /tmp", shell=True, check=True)
          sp.run(f"unzip -q /tmp/gradle-{GRADLE_VER}-bin.zip -d /tmp/gradle-inst", shell=True, check=True)
          os.makedirs('/tmp/tmpwrapper', exist_ok=True)
          write('/tmp/tmpwrapper/settings.gradle', 'rootProject.name = "tmp"')
          sp.run(
              f"/tmp/gradle-inst/gradle-{GRADLE_VER}/bin/gradle wrapper "
              f"--gradle-version {GRADLE_VER} --distribution-type bin "
              f"--project-dir /tmp/tmpwrapper",
              shell=True, check=True
          )
          shutil.copytree('/tmp/tmpwrapper/gradle', 'gradle', dirs_exist_ok=True)
          shutil.copy('/tmp/tmpwrapper/gradlew', 'gradlew')
          os.chmod('gradlew', 0o755)
          print("✅ Gradle wrapper 8.9")

          # ── 13. Build APK ───────────────────────────────────────────────
          print("\n🔨 Building debug APK...")
          result = subprocess.run(
              './gradlew :app:assembleDebug --no-daemon --stacktrace '
              '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"',
              shell=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True
          )
          output = result.stdout
          with open('/tmp/build_full.log', 'w') as f:
              f.write(output)
          lines = output.splitlines()
          print('\n'.join(lines[-500:]))

          if result.returncode != 0:
              print("\n════ KOTLIN ERRORS ════")
              for line in lines:
                  if line.startswith('e: ') or 'error:' in line.lower():
                      print(line)
              print("\n════ TASK FAILURES ════")
              for line in lines:
                  if any(x in line for x in ['FAILED','Unresolved','Cannot access','not found','Caused by:']):
                      print(line)
              sys.exit(result.returncode)

          apk = None
          for root, _, files in os.walk('app/build/outputs/apk/debug'):
              for f in files:
                  if f.endswith('.apk'):
                      apk = os.path.join(root, f); break
          if apk:
              size = os.path.getsize(apk) // 1_048_576
              print(f"\n✅ SUCCESS — APK: {apk} ({size} MB)")
          else:
              print("❌ APK not found!"); sys.exit(1)
          PYEOF

