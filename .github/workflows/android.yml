name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (with Plugin Fix)
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap
          def read(p):
              with open(p, encoding='utf-8') as f: return f.read()
          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # 1. Extract
          src = "project.txt"
          content = read(src)
          pattern = re.compile(r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)', re.DOTALL)
          for m in pattern.finditer(content):
              write(m.group(1).strip().lstrip('/'), m.group(2).rstrip('\n'))

          # 2. Fix Plugin/Dependency Graph
          app_gradle = 'app/build.gradle.kts'
          if os.path.exists(app_gradle):
              c = read(app_gradle)
              # إضافة تعريف الـ google-services في الـ plugins إذا كان مفقوداً
              if 'id("com.google.gms.google-services")' in c and 'alias(libs.plugins.google.services)' not in c:
                  c = c.replace('id("com.google.gms.google-services")', 'alias(libs.plugins.google.services)')
              write(app_gradle, c)
          
          # Fix BaseRepository
          br_path = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(br_path):
              write(br_path, read(br_path).replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker'))

          # 3. Build
          os.chmod('gradlew', 0o755)
          print("\n🔨 Building debug APK …")
          # استخدام --stacktrace للحصول على تفاصيل أدق عند الخطأ
          subprocess.run(['./gradlew', ':app:assembleDebug', '--no-daemon'], check=True)
          print("✅ SUCCESS")
          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
