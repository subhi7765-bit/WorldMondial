name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt', 'app/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap

          def read(p):
              if os.path.exists(p):
                  with open(p, encoding='utf-8') as f: return f.read()
              return ""

          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # ── 1. استخراج الملفات من project.txt ──────────────────────────
          src = "project.txt"
          if not os.path.exists(src):
              print("❌ project.txt not found!"); sys.exit(1)
          content = read(src)
          pattern = re.compile(
              r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)',
              re.DOTALL
          )
          count = 0
          for m in pattern.finditer(content):
              fp   = m.group(1).strip().lstrip('/')
              body = m.group(2).rstrip('\n')
              write(fp, body)
              count += 1
          print(f"✅ Extracted {count} source files")

          # ── 1b. إصلاحات تلقائية بعد الاستخراج ────────────────────────

          # FIX-1: BaseRepository — جعل الحقل Public بالكامل لحقن Hilt/KSP الناجح
          base_repo_path = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(base_repo_path):
              c = read(base_repo_path)
              c = c.replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker')
              c = c.replace('internal lateinit var analyticsTracker', 'lateinit var analyticsTracker')
              write(base_repo_path, c)
              print("✅ FIX-1: BaseRepository.kt — visibility set to public")

          # FIX-2: DatabaseModule — تحديث التوافقية لـ Room 2.7+
          db_module = 'core/database/src/main/java/sa/mondial/world/core/database/di/DatabaseModule.kt'
          if os.path.exists(db_module):
              c = read(db_module).replace('.fallbackToDestructiveMigration()', '.fallbackToDestructiveMigration(dropAllTables = true)')
              write(db_module, c)
              print("✅ FIX-2: DatabaseModule.kt updated")

          # FIX-3: AppError.kt — إضافة override للمتغير message
          ae = 'core/common/src/main/java/sa/mondial/world/core/common/AppError.kt'
          if os.path.exists(ae):
              c = read(ae)
              c = re.sub(r'data class Network\(val code: Int, (?:override )?val message: String\?\)', 'data class Network(val code: Int, override val message: String?)', c)
              c = re.sub(r'data class Database\((?:override )?val message: String,', 'data class Database(override val message: String,', c)
              write(ae, c)
              print("✅ FIX-3: AppError.kt fixed")

          # FIX-4: SettingsScreen — تجاوز خطأ الـ R عبر حقن نصوص برمجية ثابتة مباشرة لإلغاء التضارب الموديولي
          ss = 'feature/settings/src/main/java/sa/mondial/world/feature/settings/presentation/SettingsScreen.kt'
          if os.path.exists(ss):
              c = read(ss)
              c = re.sub(r'import sa\.mondial\.world\..*R', '', c)
              c = re.sub(r'import sa\.mondial\.world\.R', '', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.settings_title\s*\)', '"إعدادات النظام"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.language_english\s*\)', '"English"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.language_arabic\s*\)', '"العربية"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.language\s*\)', '"اللغة"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.theme_light\s*\)', '"فاتح"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.theme_dark\s*\)', '"داكن"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.theme_system\s*\)', '"تلقائي"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.theme\s*\)', '"المظهر"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.notifications\s*\)', '"الإشعارات"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.live_alerts_desc\s*\)', '"تلقي تنبيهات فورية عند تسجيل الأهداف"', c)
              c = re.sub(r'stringResource\s*\(\s*R\.string\.live_alerts\s*\)', '"التنبيهات المباشرة"', c)
              c = c.replace('R.string.settings_title', '"إعدادات النظام"').replace('R.string.language', '"اللغة"').replace('R.string.theme', '"المظهر"')
              write(ss, c)
              print("✅ FIX-4: SettingsScreen resources hardcoded smoothly")

          # FIX-5: MatchDetailsViewModel — تأمين وسم HiltViewModel
          md_vm = 'feature/matches/src/main/java/sa/mondial/world/feature/matches/presentation/MatchDetailsViewModel.kt'
          if os.path.exists(md_vm):
              c = read(md_vm)
              if '@HiltViewModel' not in c:
                  c = c.replace('class MatchDetailsViewModel', '@HiltViewModel\nclass MatchDetailsViewModel')
                  write(md_vm, c)
                  print("✅ FIX-5: MatchDetailsViewModel annotation injected")

          # ── 2. gradle.properties ────────────────────────────────────────
          write('gradle.properties',
              'android.useAndroidX=true\nandroid.enableJetifier=true\n'
              'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n'
              'org.gradle.daemon=false\norg.gradle.parallel=false\n')

          # ── 3. google-services.json ─────────────────────────────────────
          write('app/google-services.json', """{
            "project_info":{"project_number":"940789403342","project_id":"world-mondial","storage_bucket":"world-mondial.firebasestorage.app"},
            "client":[{"client_info":{"mobilesdk_app_id":"1:940789403342:android:088eaf9d6bdb4a3e9e4a9f","android_client_info":{"package_name":"sa.mondial.world"}(_)},"api_key":[{"current_key":"AIzaSyD5QcgMhaHvVkvChUqEVlArCwAO9F84RF0"}]}]
          }""")

          # ── 4. libs.versions.toml ───────────────────────────────────────
          write('gradle/libs.versions.toml', textwrap.dedent("""\
          [versions]
          kotlin               = "2.0.21"
          compose              = "1.7.5"
          material3            = "1.3.1"
          room                 = "2.7.1"
          hilt                 = "2.55"
          paging               = "3.3.2"
          androidGradlePlugin  = "8.7.2"
          ksp                  = "2.0.21-1.0.26"
          kotlinxSerialization = "1.6.3"
          androidxNavigation   = "2.8.4"
          timber               = "5.0.1"
          okhttp               = "4.12.0"
          retrofit             = "2.11.0"
          lifecycle            = "2.8.7"
          datastore            = "1.1.1"
          coil                 = "2.6.0"
          work                 = "2.9.1"

          [libraries]
          androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui",                              version.ref = "compose"              }
          androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3",                       version.ref = "material3"            }
          androidx-navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",              version.ref = "androidxNavigation"   }
          kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",      version.ref = "kotlinxSerialization" }
          hilt-android                         = { group = "com.google.dagger",           name = "hilt-android",                    version.ref = "hilt"                 }
          hilt-compiler                        = { group = "com.google.dagger",           name = "hilt-compiler",                   version.ref = "hilt"                 }
          androidx-hilt-navigation-compose     = { group = "androidx.hilt",               name = "hilt-navigation-compose",         version = "1.2.0"                    }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",     version.ref = "lifecycle"            }
          androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",       version.ref = "lifecycle"            }
          timber                               = { group = "com.jakewharton.timber",      name = "timber",                          version.ref = "timber"               }
          kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",      version = "1.9.0"                    }
          kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",         version = "1.9.0"                    }
          kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",         version = "1.9.0"                    }
          retrofit-core                        = { group = "com.squareup.retrofit2",      name = "retrofit",                        version.ref = "retrofit"             }
          retrofit-kotlinx-serialization       = { group = "com.squareup.retrofit2",      name = "converter-kotlinx-serialization", version.ref = "retrofit"             }
          okhttp-logging                       = { group = "com.squareup.okhttp3",        name = "logging-interceptor",             version.ref = "okhttp"               }
          room-runtime                         = { group = "androidx.room",               name = "room-runtime",                    version.ref = "room"                 }
          room-ktx                             = { group = "androidx.room",               name = "room-ktx",                        version.ref = "room"                 }
          room-compiler                        = { group = "androidx.room",               name = "room-compiler",                   version.ref = "room"                 }
          androidx-datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",           version.ref = "datastore"            }
          coil-compose                         = { group = "io.coil-kt",                  name = "coil-compose",                    version.ref = "coil"                 }
          androidx-paging-runtime              = { group = "androidx.paging",             name = "paging-runtime",                  version.ref = "paging"               }
          androidx-paging-compose              = { group = "androidx.paging",             name = "paging-compose",                  version.ref = "paging"               }
          androidx-work-runtime                = { group = "androidx.work",               name = "work-runtime-ktx",                version.ref = "work"                 }
          androidx-appcompat                   = { group = "androidx.appcompat",          name = "appcompat",                       version = "1.7.0"                    }

          [plugins]
          google-services      = { id = "com.google.gms.google-services",            version = "4.4.2"                   }
          android-application  = { id = "com.android.application",                   version.ref = "androidGradlePlugin" }
          android-library      = { id = "com.android.library",                       version.ref = "androidGradlePlugin" }
          kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin"              }
          kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin"              }
          kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"              }
          ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp"                 }
          hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt"                }
          """))

          # ── 5. Root build.gradle.kts ────────────────────────────────────
          write('build.gradle.kts', textwrap.dedent("""\
          plugins {
              alias(libs.plugins.android.application)  apply false
              alias(libs.plugins.android.library)      apply false
              alias(libs.plugins.kotlin.android)       apply false
              alias(libs.plugins.kotlin.compose)       apply false
              alias(libs.plugins.kotlin.serialization) apply false
              alias(libs.plugins.ksp)                  apply false
              alias(libs.plugins.hilt)                 apply false
              alias(libs.plugins.google.services)      apply false
          }
          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                      freeCompilerArgs.addAll("-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi", "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api")
                  }
              }
          }
          """))

          # ── 6. Core Modules Build Architecture ────────────────────────
          write('core/common/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.common"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.timber) }')
          write('core/domain/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization) }\nandroid { namespace = "sa.mondial.world.core.domain"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.kotlinx.serialization.json) }')
          write('core/database/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt); alias(libs.plugins.kotlin.serialization) }\nandroid { namespace = "sa.mondial.world.core.database"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.room.runtime); implementation(libs.room.ktx); ksp(libs.room.compiler); implementation(libs.project(":core:common")); implementation(libs.project(":core:domain")) }')
          write('core/network/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.network"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.retrofit.kotlinx.serialization); implementation(libs.okhttp.logging); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:database")) }')
          write('core/analytics/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.analytics"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.timber); implementation(platform("com.google.firebase:firebase-bom:33.10.0")); implementation("com.google.firebase:firebase-analytics-ktx") }')
          write('core/di/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.di"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(project(":core:common")) }')
          write('core/ui/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.compose) }\nandroid { namespace = "sa.mondial.world.core.ui"; compileSdk = 35; defaultConfig { minSdk = 26 }; buildFeatures { compose = true }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.androidx.compose.ui); implementation(libs.androidx.compose.material3) }')
          write('core/testing/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android) }\nandroid { namespace = "sa.mondial.world.core.testing"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.junit); implementation(libs.mockk); implementation(libs.turbine); implementation(libs.kotlinx.coroutines.test) }')
          write('core/notifications/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.notifications"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.timber); implementation(libs.androidx.work.runtime); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:data")); implementation(project(":core:analytics")) }')
          
          # core:data
          write('core/data/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.data"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies {
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.hilt.android)
