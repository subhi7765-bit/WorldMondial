name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (Definitive Selective Hotfix Approach)
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap
          
          def run(cmd, check=True):
              print(f"$ {cmd[:120]}")
              r = subprocess.run(cmd, shell=True)
              if check and r.returncode != 0:
                  print(f"❌ Failed (exit {r.returncode})")
                  sys.exit(r.returncode)
              return r.returncode
              
          def read(p):
              with open(p, encoding='utf-8') as f: return f.read()
              
          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)
              
          # ── 1. Extract all source files from project.txt ──────────────
          src = "project.txt"
          if not os.path.exists(src):
              print("❌ project.txt not found!"); sys.exit(1)
          content = read(src)
          pattern = re.compile(
              r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)',
              re.DOTALL
          )
          count = 0
          for m in pattern.finditer(content):
              fp   = m.group(1).strip().lstrip('/')
              body = m.group(2).rstrip('\n')
              write(fp, body)
              count += 1
          print(f"✅ Extracted {count} source files cleanly.")
          
          # ── 2. Apply Definitive Selective Hotfixes ────────────────────
          
          # الإصلاح 1: إضافة الـ plugin الخاص بخدمات جوجل للمستودع الرئيسي لمنع خطأ Unresolved للـ Firebase
          p = 'build.gradle.kts'
          if os.path.exists(p):
              c = read(p)
              if 'com.google.gms.google-services' not in c:
                  c = c.replace('plugins {', 'plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false')
                  write(p, c)
                  
          # الإصلاح 2: تمرير الإصدار لملف الـ app لضمان التعرف عليه بشكل قاطع
          p = 'app/build.gradle.kts'
          if os.path.exists(p):
              c = read(p)
              if 'id("com.google.gms.google-services")' in c and 'version' not in c:
                  c = c.replace('id("com.google.gms.google-services")', 'id("com.google.gms.google-services") version "4.4.2"')
              write(p, c)

          # الإصلاح 3: ربط موديولات الـ features بالاعتماديات الوسطى بشكل صحيح وضخ hilt compiler داخلها
          for mod in ['feature/matches', 'feature/news', 'feature/settings']:
              p = f'{mod}/build.gradle.kts'
              if os.path.exists(p):
                  c = read(p)
                  if 'core:database' not in c:
                      c = c.replace('dependencies {', 
                                    'dependencies {\n    ksp(libs.hilt.compiler)\n    implementation(project(":core:database"))\n    implementation(project(":core:network"))\n    implementation(project(":core:data"))\n    implementation(project(":core:analytics"))')
                      write(p, c)

          # الإصلاح 4: تعديل الخطأ القواعدي لعلامات التنصيص الطويلة في MatchDetailsScreen
          mds_path = 'feature/matches/src/main/java/sa/mondial/world/feature/matches/presentation/MatchDetailsScreen.kt'
          if os.path.exists(mds_path):
              c = read(mds_path).replace('\r\n', '\n')
              c = c.replace('"🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"', '"""🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"""')
              c = c.replace('"🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"', '"""🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"""')
              write(mds_path, c)

          # الإصلاح 5: تعديل الـ field visibility في BaseRepository ليتمكن Hilt من حقنه بنجاح
          base_repo_path = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(base_repo_path):
              c = read(base_repo_path)
              c = c.replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker')
              write(base_repo_path, c)

          # الإصلاح 6: ضخ مكتبة الـ WorkManager بالإحداثيات المباشرة لموديول الإشعارات لتجنب أي نقص في الكتالوج
          p = 'core/notifications/build.gradle.kts'
          if os.path.exists(p):
              c = read(p)
              if 'work-runtime' not in c:
                  c = c.replace('dependencies {', 'dependencies {\n    implementation("androidx.work:work-runtime-ktx:2.9.1")\n    implementation("androidx.work:work-multiprocess:2.9.1")')
                  write(p, c)

          # الإصلاح 7: ضخ مكتبة Timber وموديول التحليلات المفقودين لموديول البيانات
          p = 'core/data/build.gradle.kts'
          if os.path.exists(p):
              c = read(p)
              if 'libs.timber' not in c:
                  c = c.replace('dependencies {', 'dependencies {\n    implementation(libs.timber)\n    implementation(project(":core:analytics"))')
                  write(p, c)

          # ── 3. Build Configuration & Execution ────────────────────────
          # إعطاء صلاحيات التنفيذ الكاملة لملف الكومبايلر gradlew
          os.chmod('gradlew', 0o755)
          
          print("\n🔨 Building debug APK cleanly …")
          build_proc = subprocess.run(
              './gradlew :app:assembleDebug --no-daemon '
              '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"',
              shell=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True
          )
          
          rc = build_proc.returncode
          build_out = build_proc.stdout
          with open('/tmp/build_full.log', 'w') as f:
              f.write(build_out)
              
          lines = build_out.splitlines()
          print('\n'.join(lines[-300:]))
          
          if rc != 0:
              print("\n════ KOTLIN ERRORS ════")
              for line in lines:
                  if line.startswith('e: '):
                      print(line)
              print("\n════ TASK FAILURES ════")
              for line in lines:
                  if any(x in line for x in ['FAILED','Unresolved','Cannot access','not found','Caused by:']):
                      print(line)
              sys.exit(rc)
              
          apk = None
          for root, _, files in os.walk('app/build/outputs/apk/debug'):
              for f in files:
                  if f.endswith('.apk'):
                      apk = os.path.join(root, f); break
          if apk:
              print(f"\n✅ SUCCESS — APK: {apk} ({os.path.getsize(apk)//1_048_576} MB)")
          else:
              print("❌ APK not found!"); sys.exit(1)
          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
