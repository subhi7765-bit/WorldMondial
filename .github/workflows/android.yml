name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (with permission fix)
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap
          def read(p):
              with open(p, encoding='utf-8') as f: return f.read()
          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # 1. Extraction
          src = "project.txt"
          content = read(src)
          pattern = re.compile(r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)', re.DOTALL)
          for m in pattern.finditer(content):
              write(m.group(1).strip().lstrip('/'), m.group(2).rstrip('\n'))

          # 2. Hotfixes
          for mod in ['feature/news', 'feature/matches', 'feature/settings']:
              p = f'{mod}/build.gradle.kts'
              if os.path.exists(p):
                  c = read(p)
                  if 'core:database' not in c:
                      c = c.replace('implementation(project(":core:common"))', 
                                    'implementation(project(":core:common"))\n    implementation(project(":core:database"))\n    implementation(project(":core:network"))\n    implementation(project(":core:data"))\n    implementation(project(":core:analytics"))')
                      write(p, c)

          # Fix BaseRepository
          br_path = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(br_path):
              write(br_path, read(br_path).replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker'))

          # 3. FIX: Grant execute permission to gradlew
          os.chmod('gradlew', stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH | stat.S_IRUSR | stat.S_IWUSR)

          print("\n🔨 Building debug APK …")
          # Final build
          build_proc = subprocess.run(['./gradlew', ':app:assembleDebug', '--no-daemon'], 
                                      stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(build_proc.stdout)
          if build_proc.returncode != 0:
              sys.exit(build_proc.returncode)
          print("✅ SUCCESS")
          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
