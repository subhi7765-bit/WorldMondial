name: Test Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Test Workflow
        run: |
          echo "✅ Workflow is working correctly!"
          echo "Java version:"
          java -version
          echo "Current directory:"
          ls -la
