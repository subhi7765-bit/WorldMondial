name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (with libs.versions.toml Fix)
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap
          def read(p): return open(p, encoding='utf-8').read() if os.path.exists(p) else ""
          def write(p, c):
              os.makedirs(os.path.dirname(p), exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # 1. Extract
          content = read("project.txt")
          pattern = re.compile(r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)', re.DOTALL)
          for m in pattern.finditer(content):
              write(m.group(1).strip().lstrip('/'), m.group(2).rstrip('\n'))

          # 2. Correct libs.versions.toml (The Root Cause)
          libs_toml = """
          [versions]
          kotlin = "2.0.21"
          androidGradlePlugin = "8.7.2"
          ksp = "2.0.21-1.0.26"
          hilt = "2.55"
          googleServices = "4.4.2"
          
          [plugins]
          android-application = { id = "com.android.application", version.ref = "androidGradlePlugin" }
          android-library = { id = "com.android.library", version.ref = "androidGradlePlugin" }
          kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
          kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
          kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
          ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
          hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
          google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
          """
          write('gradle/libs.versions.toml', textwrap.dedent(libs_toml))

          # 3. Build
          os.chmod('gradlew', 0o755)
          print("\n🔨 Building debug APK …")
          subprocess.run(['./gradlew', ':app:assembleDebug', '--no-daemon'], check=True)
          print("✅ SUCCESS")
          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
