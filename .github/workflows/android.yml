name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt', 'app/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Debug APK
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap

          def read(p):
              if os.path.exists(p):
                  with open(p, encoding='utf-8') as f: return f.read()
              return ""

          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # ── 1. استخراج الملفات من project.txt ──────────────────────────
          src = "project.txt"
          if not os.path.exists(src):
              print("❌ project.txt not found!"); sys.exit(1)
          content = read(src)
          pattern = re.compile(
              r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)',
              re.DOTALL
          )
          count = 0
          for m in pattern.finditer(content):
              fp   = m.group(1).strip().lstrip('/')
              body = m.group(2).rstrip('\n')
              write(fp, body)
              count += 1
          print(f"✅ Extracted {count} source files")

          # ── 1b. إصلاحات تلقائية بعد الاستخراج ────────────────────────

          # FIX-1: BaseRepository — جعل الحقل Public بالكامل لأن محددات internal و protected تمنع Hilt/KSP من التعرف عليه
          base_repo_path = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(base_repo_path):
              c = read(base_repo_path)
              c = c.replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker')
              c = c.replace('internal lateinit var analyticsTracker', 'lateinit var analyticsTracker')
              write(base_repo_path, c)
              print("✅ FIX-1: BaseRepository.kt — analyticsTracker visibility set to public")

          # FIX-2: DatabaseModule — fallbackToDestructiveMigration() deprecated in Room 2.7+
          db_module = 'core/database/src/main/java/sa/mondial/world/core/database/di/DatabaseModule.kt'
          if os.path.exists(db_module):
              c = read(db_module)
              c = c.replace(
                  '.fallbackToDestructiveMigration()',
                  '.fallbackToDestructiveMigration(dropAllTables = true)'
              )
              write(db_module, c)
              print("✅ FIX-2: DatabaseModule.kt — fallbackToDestructiveMigration updated")

          # FIX-3: AppError.kt — Database.message يحتاج override من Throwable
          ae = 'core/common/src/main/java/sa/mondial/world/core/common/AppError.kt'
          if os.path.exists(ae):
              c = read(ae)
              c = re.sub(
                  r'data class Network\(val code: Int, (?:override )?val message: String\?\)',
                  'data class Network(val code: Int, override val message: String?)', c)
              c = re.sub(
                  r'data class Database\((?:override )?val message: String,',
                  'data class Database(override val message: String,', c)
              write(ae, c)
              print("✅ FIX-3: AppError.kt — override message added")

          # FIX-4: AuthRepository.kt — ترتيب imports خاطئ في الملف الأصلي
          write('core/network/src/main/java/sa/mondial/world/core/network/AuthRepository.kt',
              textwrap.dedent("""\
              package sa.mondial.world.core.network

              import dagger.Binds
              import dagger.Module
              import dagger.hilt.InstallIn
              import dagger.hilt.components.SingletonComponent
              import javax.inject.Inject
              import javax.inject.Singleton

              interface AuthRepository {
                  suspend fun refreshToken(): String?
              }

              @Singleton
              class AuthRepositoryImpl @Inject constructor() : AuthRepository {
                  override suspend fun refreshToken(): String? = "new_access_token_xyz987"
              }

              @Module
              @InstallIn(SingletonComponent::class)
              abstract class AuthModule {
                  @Binds @Singleton
                  abstract fun bindAuthRepository(impl: AuthRepositoryImpl): AuthRepository
              }
              """))
          print("✅ FIX-4: AuthRepository.kt — imports reordered")

          # FIX-5: SettingsScreen R import من app namespace إلى feature namespace
          ss = 'feature/settings/src/main/java/sa/mondial/world/feature/settings/presentation/SettingsScreen.kt'
          if os.path.exists(ss):
              c = read(ss)
              c = c.replace('import sa.mondial.world.R', 'import sa.mondial.world.feature.settings.R')
              write(ss, c)

          write('feature/settings/src/main/res/values/strings.xml', textwrap.dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="settings_title">System Settings</string>
              <string name="language">Language</string>
              <string name="language_english">English</string>
              <string name="language_arabic">Arabic</string>
              <string name="theme">Theme</string>
              <string name="theme_light">Light</string>
              <string name="theme_dark">Dark</string>
              <string name="theme_system">System Default</string>
              <string name="notifications">Notifications</string>
              <string name="live_alerts">Live Goal Alerts</string>
              <string name="live_alerts_desc">Receive push alerts instantly on goals</string>
          </resources>
          """))
          print("✅ FIX-5: SettingsScreen R import fixed")

          # FIX-6: Feature modules — إضافة dependencies الناقصة إن لم تكن موجودة
          for mod in ['feature/news', 'feature/matches', 'feature/settings']:
              p = f'{mod}/build.gradle.kts'
              if os.path.exists(p):
                  c = read(p)
                  if 'core:database' not in c:
                      c = c.replace(
                          'implementation(project(":core:common"))',
                          'implementation(project(":core:common"))\n    implementation(project(":core:database"))\n    implementation(project(":core:network"))\n    implementation(project(":core:data"))\n    implementation(project(":core:analytics"))'
                      )
                      write(p, c)

          # FIX-7: MatchDetailsScreen — إصلاح multiline strings
          mds_path = 'feature/matches/src/main/java/sa/mondial/world/feature/matches/presentation/MatchDetailsScreen.kt'
          if os.path.exists(mds_path):
              c = read(mds_path).replace('\r\n', '\n')
              c = c.replace(
                  '"🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"',
                  '"""🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"""'
              )
              c = c.replace(
                  '"🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"',
                  '"""🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"""'
              )
              write(mds_path, c)
              print("✅ FIX-7: MatchDetailsScreen multiline strings fixed")

          print("✅ All automated hotfixes applied")

          # ── 2. gradle.properties ────────────────────────────────────────
