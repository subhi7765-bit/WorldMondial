name: Build World Mondial Release AAB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Inject Secrets into local.properties
        run: |
          echo "FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}" >> local.properties
          echo "NEWS_API_KEY=${{ secrets.NEWS_API_KEY }}" >> local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties

      - name: Decode Production Keystore File
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/worldmondial.jks

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Build Production Release AAB
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        run: ./gradlew :app:bundleRelease --no-daemon --stacktrace

      - name: Archive and Upload Compiled AAB
        uses: actions/upload-artifact@v4
        with:
          name: WorldMondial-Release-AAB
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
