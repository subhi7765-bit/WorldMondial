          main_mf = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(main_mf):
              c = read(main_mf)
              c = re.sub(r'\s*package="[^"]*"', '', c)
              write(main_mf, c)
          print("✅ AndroidManifest.xml package= removed")

