name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: chmod +x gradlew

      - name: Diagnose Project Structure
        run: |
          echo "=== Root Files ==="
          ls -la
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts || echo "Not found"
          echo "=== App Folder ==="
          ls -la app || echo "App folder not found"
          echo "=== Available Projects ==="
          ./gradlew projects --console=plain

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
