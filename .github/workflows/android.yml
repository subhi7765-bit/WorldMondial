name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (single Python script)
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap
          def run(cmd, check=True):
              print(f"$ {cmd[:120]}")
              r = subprocess.run(cmd, shell=True)
              if check and r.returncode != 0:
                  print(f"❌ Failed (exit {r.returncode})")
                  sys.exit(r.returncode)
              return r.returncode
          def read(p):
              with open(p, encoding='utf-8') as f: return f.read()
          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)
          # ── 1. Extract all source files from project.txt ──────────────
          src = "project.txt"
          if not os.path.exists(src):
              print("❌ project.txt not found!"); sys.exit(1)
          content = read(src)
          pattern = re.compile(
              r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)',
              re.DOTALL
          )
          count = 0
          for m in pattern.finditer(content):
              fp   = m.group(1).strip().lstrip('/')
              body = m.group(2).rstrip('\n')
              write(fp, body)
              count += 1
          print(f"✅ Extracted {count} source files")
          # ── 2. gradle.properties ──────────────────────────────────────
          write('gradle.properties',
              'android.useAndroidX=true\n'
              'android.enableJetifier=true\n'
              'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n'
              'org.gradle.daemon=false\n'
              'org.gradle.parallel=false\n'
              'kotlin.jvm.target.validation.mode=WARNING\n')
          print("✅ gradle.properties")
          # ── 3. google-services.json ───────────────────────────────────
          write('app/google-services.json', """{
            "project_info":{
              "project_number":"940789403342",
              "project_id":"world-mondial",
              "storage_bucket":"world-mondial.firebasestorage.app"
            },
            "client":[{
              "client_info":{
                "mobilesdk_app_id":"1:940789403342:android:088eaf9d6bdb4a3e9e4a9f",
                "android_client_info":{"package_name":"sa.mondial.world"}
              },
              "oauth_client":[],
              "api_key":[{"current_key":"AIzaSyD5QcgMhaHvVkvChUqEVlArCwAO9F84RF0"}],
              "services":{"appinvite_service":{"other_platform_oauth_client":[]}}
            }],
            "configuration_version":"1"
          }""")
          print("✅ google-services.json")
          # ── 4. libs.versions.toml ─────────────────────────────────────
          write('gradle/libs.versions.toml', textwrap.dedent("""\
          [versions]
          kotlin               = "2.0.21"
          compose              = "1.7.5"
          material3            = "1.3.1"
          room                 = "2.7.1"
          hilt                 = "2.55"
          paging               = "3.3.2"
          androidGradlePlugin  = "8.7.2"
          ksp                  = "2.0.21-1.0.26"
          kotlinxSerialization = "1.6.3"
          androidxNavigation   = "2.8.4"
          timber               = "5.0.1"
          okhttp               = "4.12.0"
          retrofit             = "2.11.0"
          lifecycle            = "2.8.7"
          datastore            = "1.1.1"
          coil                 = "2.6.0"
          junit                = "4.13.2"
          mockk                = "1.13.10"
          turbine              = "1.1.0"
          [libraries]
          androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui",                              version.ref = "compose"              }
          androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3",                       version.ref = "material3"            }
          androidx-navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",              version.ref = "androidxNavigation"   }
          kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",      version.ref = "kotlinxSerialization" }
          hilt-android                         = { group = "com.google.dagger",           name = "hilt-android",                    version.ref = "hilt"                 }
          hilt-compiler                        = { group = "com.google.dagger",           name = "hilt-compiler",                   version.ref = "hilt"                 }
          androidx-hilt-navigation-compose     = { group = "androidx.hilt",               name = "hilt-navigation-compose",         version = "1.2.0"                    }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",     version.ref = "lifecycle"            }
          androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",       version.ref = "lifecycle"            }
          timber                               = { group = "com.jakewharton.timber",      name = "timber",                          version.ref = "timber"               }
          kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",      version = "1.9.0"                    }
          kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",         version = "1.9.0"                    }
          kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",         version = "1.9.0"                    }
          retrofit-core                        = { group = "com.squareup.retrofit2",      name = "retrofit",                        version.ref = "retrofit"             }
          retrofit-kotlinx-serialization       = { group = "com.squareup.retrofit2",      name = "converter-kotlinx-serialization", version.ref = "retrofit"             }
          okhttp-logging                       = { group = "com.squareup.okhttp3",        name = "logging-interceptor",             version.ref = "okhttp"               }
          room-runtime                         = { group = "androidx.room",               name = "room-runtime",                    version.ref = "room"                 }
          room-ktx                             = { group = "androidx.room",               name = "room-ktx",                        version.ref = "room"                 }
          room-compiler                        = { group = "androidx.room",               name = "room-compiler",                   version.ref = "room"                 }
          androidx-datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",           version.ref = "datastore"            }
          coil-compose                         = { group = "io.coil-kt",                  name = "coil-compose",                    version.ref = "coil"                 }
          androidx-paging-runtime              = { group = "androidx.paging",             name = "paging-runtime",                  version.ref = "paging"               }
          androidx-paging-compose              = { group = "androidx.paging",             name = "paging-compose",                  version.ref = "paging"               }
          junit                                = { group = "junit",                       name = "junit",                           version.ref = "junit"                }
          mockk                                = { group = "io.mockk",                   name = "mockk",                           version.ref = "mockk"                }
          turbine                              = { group = "app.cash.turbine",            name = "turbine",                         version.ref = "turbine"              }
          androidx-test-rules                  = { group = "androidx.test",               name = "rules",                           version = "1.6.1"                    }
          [plugins]
          google-services      = { id = "com.google.gms.google-services",            version = "4.4.2"                   }
          android-application  = { id = "com.android.application",                   version.ref = "androidGradlePlugin" }
          android-library      = { id = "com.android.library",                       version.ref = "androidGradlePlugin" }
          kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin"              }
          kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin"              }
          kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"              }
          ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp"                 }
          hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt"                }
          """))
          print("✅ libs.versions.toml")
          # ── 5. Root build.gradle.kts ──────────────────────────────────
          write('build.gradle.kts', textwrap.dedent("""\
          plugins {
              alias(libs.plugins.android.application)  apply false
              alias(libs.plugins.android.library)      apply false
              alias(libs.plugins.kotlin.android)       apply false
              alias(libs.plugins.kotlin.compose)       apply false
              alias(libs.plugins.kotlin.serialization) apply false
              alias(libs.plugins.ksp)                  apply false
              alias(libs.plugins.hilt)                 apply false
              alias(libs.plugins.google.services)      apply false
          }
          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                      freeCompilerArgs.addAll(
                          "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                          "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                          "-opt-in=kotlinx.coroutines.FlowPreview"
                      )
                  }
              }
          }
          """))
          print("✅ root build.gradle.kts")
          # ── 6. core/common/build.gradle.kts ──────────────────────────
          write('core/common/build.gradle.kts', textwrap.dedent("""\
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
          }
          android {
              namespace = "sa.mondial.world.core.common"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.retrofit.core)
              implementation(libs.timber)
          }
          """))
          print("✅ core/common/build.gradle.kts")
          # ── 7. core/domain/build.gradle.kts ──────────────────────────
          write('core/domain/build.gradle.kts', textwrap.dedent("""\
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.serialization)
          }
          android {
              namespace = "sa.mondial.world.core.domain"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.kotlinx.serialization.json)
          }
          """))
          print("✅ core/domain/build.gradle.kts")
          # ── 8. core/database/build.gradle.kts ────────────────────────
          write('core/database/build.gradle.kts', textwrap.dedent("""\
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
              alias(libs.plugins.kotlin.serialization)
          }
          android {
              namespace = "sa.mondial.world.core.database"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.room.runtime)
              implementation(libs.room.ktx)
              ksp(libs.room.compiler)
              implementation(libs.kotlinx.serialization.json)
              implementation(project(":core:common"))
              implementation(project(":core:domain"))
          }
          """))
          print("✅ core/database/build.gradle.kts")
          # ── 9. core/network/build.gradle.kts ─────────────────────────
          write('core/network/build.gradle.kts', textwrap.dedent("""\
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.serialization)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
          }
          android {
              namespace = "sa.mondial.world.core.network"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.retrofit.core)
              implementation(libs.retrofit.kotlinx.serialization)
              implementation(libs.kotlinx.serialization.json)
              implementation(libs.okhttp.logging)
              implementation(project(":core:common"))
              implementation(project(":core:domain"))
              implementation(project(":core:database"))
          }
          """))
          print("✅ core/network/build.gradle.kts")
          # ── 10. core/notifications/build.gradle.kts — FIX: +domain ───
          write('core/notifications/build.gradle.kts', textwrap.dedent("""\
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
          }
          android {
              namespace = "sa.mondial.world.core.notifications"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          dependencies {
              implementation(libs.kotlinx.coroutines.core)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(project(":core:common"))
              implementation(project(":core:domain"))
              implementation(project(":core:database"))
              implementation(project(":core:data"))
              implementation(project(":core:analytics"))
              implementation(libs.room.runtime)
              implementation(libs.room.ktx)
              implementation("com.google.firebase:firebase-messaging:23.4.0")
              implementation("com.google.firebase:firebase-analytics:21.6.2")
              implementation(libs.timber)
          }
          """))
          print("✅ core/notifications/build.gradle.kts")
          # ── 11. app/build.gradle.kts ──────────────────────────────────
          p = 'app/build.gradle.kts'
          c = read(p)
          c = c.replace('id("com.google.gms.google-services")', 'alias(libs.plugins.google.services)')
          c = c.replace('isMinifyEnabled = true', 'isMinifyEnabled = false')
          extra_deps = (
              '    // ── added by CI fixer ────────────────────────────────\n'
              '    implementation("androidx.appcompat:appcompat:1.7.0")\n'
              '    implementation("androidx.core:core-ktx:1.13.1")\n'
              '    implementation("androidx.activity:activity-compose:1.9.3")\n'
              '    implementation("androidx.compose.material:material-icons-extended:1.7.5")\n'
              '    implementation("com.google.android.material:material:1.12.0")\n'
              '    implementation("com.google.android.material:material:1.12.0")\n'
              '    implementation("com.google.firebase:firebase-crashlytics:19.2.1")\n'
          )
          if 'androidx.appcompat:appcompat' not in c:
              c = c[:c.rfind('\n}')] + '\n' + extra_deps + '\n}'
          write(p, c)
          print("✅ app/build.gradle.kts")
          # ── 12. core/data deps ────────────────────────────────────────
          p = 'core/data/build.gradle.kts'
          if os.path.exists(p):
              c = read(p)
              if 'firebase-crashlytics' not in c:
                  c = c[:c.rfind('\n}')] + \
                      '\n    implementation("com.google.firebase:firebase-crashlytics:19.2.1")\n' \
                      '    implementation(libs.retrofit.core)\n}'
                  write(p, c)
          print("✅ core/data deps")
          # ── 13. feature/matches — remove pulltorefresh ────────────────
          p = 'feature/matches/build.gradle.kts'
          if os.path.exists(p):
              c = read(p)
              c = re.sub(r'[ \t]*implementation\("androidx\.compose\.material3:material3-pulltorefresh:[^"]+"\)\n?', '', c)
              write(p, c)
          print("✅ feature/matches pulltorefresh removed")
          # ── 14. AppError.kt — override val message (Network + Database)
          p = 'core/common/src/main/java/sa/mondial/world/core/common/AppError.kt'
          if os.path.exists(p):
              c = read(p)
              c = c.replace(
                  'data class Network(val code: Int, val message: String?)',
                  'data class Network(val code: Int, override val message: String?)'
              )
              c = c.replace(
                  'data class Database(val message: String,',
                  'data class Database(override val message: String,'
              )
              write(p, c)
          print("✅ AppError.kt fixed (Network + Database)")
          # ── 15. AuthRepository.kt ─────────────────────────────────────
          write('core/network/src/main/java/sa/mondial/world/core/network/AuthRepository.kt',
              textwrap.dedent("""\
              package sa.mondial.world.core.network
              import dagger.Binds
              import dagger.Module
              import dagger.hilt.InstallIn
              import dagger.hilt.components.SingletonComponent
              import javax.inject.Inject
              import javax.inject.Singleton
              interface AuthRepository {
                  suspend fun refreshToken(): String?
              }
              @Singleton
              class AuthRepositoryImpl @Inject constructor() : AuthRepository {
                  override suspend fun refreshToken(): String? = "new_access_token_xyz987"
              }
              @Module
              @InstallIn(SingletonComponent::class)
              abstract class AuthModule {
                  @Binds @Singleton
                  abstract fun bindAuthRepository(impl: AuthRepositoryImpl): AuthRepository
              }
              """))
          print("✅ AuthRepository.kt")
          # ── 16. SettingsScreen R import + strings.xml ─────────────────
          p = 'feature/settings/src/main/java/sa/mondial/world/feature/settings/presentation/SettingsScreen.kt'
          if os.path.exists(p):
              c = read(p)
              c = c.replace('import sa.mondial.world.R', 'import sa.mondial.world.feature.settings.R')
              write(p, c)
          write('feature/settings/src/main/res/values/strings.xml', textwrap.dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="settings_title">System Settings</string>
              <string name="language">Language</string>
              <string name="language_english">English</string>
              <string name="language_arabic">Arabic</string>
              <string name="theme">Theme</string>
              <string name="theme_light">Light</string>
              <string name="theme_dark">Dark</string>
              <string name="theme_system">System Default</string>
              <string name="notifications">Notifications</string>
              <string name="live_alerts">Live Goal Alerts</string>
              <string name="live_alerts_desc">Receive push alerts instantly on goals</string>
          </resources>
          """))
          print("✅ SettingsScreen R-import + strings.xml")
          # ── 17. App resources ─────────────────────────────────────────
          write('app/src/main/res/values/themes.xml', textwrap.dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.WorldMondial" parent="Theme.MaterialComponents.DayNight.NoActionBar" />
              <style name="Theme.WorldMondial.NoActionBar" parent="Theme.WorldMondial" />
          </resources>
          """))
          if not os.path.exists('app/src/main/res/values/colors.xml'):
              write('app/src/main/res/values/colors.xml', textwrap.dedent("""\
              <?xml version="1.0" encoding="utf-8"?>
              <resources>
                  <color name="ic_launcher_background">#1565C0</color>
                  <color name="black">#FF000000</color>
                  <color name="white">#FFFFFFFF</color>
              </resources>
              """))
          write('app/src/main/res/drawable/ic_launcher_foreground.xml', textwrap.dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#FFFFFF"
                  android:pathData="M54,22 L70,54 L86,54 L73,66 L78,86 L54,74 L30,86 L35,66 L22,54 L38,54 Z"/>
          </vector>
          """))
          icon_xml = textwrap.dedent("""\
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """)
          for d in ['mipmap-anydpi-v26', 'mipmap-anydpi']:
              write(f'app/src/main/res/{d}/ic_launcher.xml', icon_xml)
              write(f'app/src/main/res/{d}/ic_launcher_round.xml', icon_xml)
          print("✅ App resources (themes, colors, icons)")
          # ── 18. AndroidManifest.xml for every library module ──────────
          lib_modules = [
              'core/common', 'core/di', 'core/network', 'core/database',
              'core/data', 'core/domain', 'core/ui', 'core/testing',
              'core/notifications', 'core/analytics', 'core/sync',
              'feature/matches', 'feature/news', 'feature/settings',
          ]
          for mod in lib_modules:
              mf = f'{mod}/src/main/AndroidManifest.xml'
              if not os.path.exists(mf):
                  write(mf, '<?xml version="1.0" encoding="utf-8"?>\n<manifest />\n')
          print(f"✅ AndroidManifest.xml for {len(lib_modules)} library modules")
          # ── 19. compileOptions Java 17 ────────────────────────────────
          compile_block = (
              '\n        compileOptions {\n'
              '            sourceCompatibility = JavaVersion.VERSION_17\n'
              '            targetCompatibility = JavaVersion.VERSION_17\n'
              '        }'
          )
          for mod in lib_modules:
              fp = f'{mod}/build.gradle.kts'
              if not os.path.exists(fp): continue
              c = read(fp)
              if 'compileOptions' in c: continue
              nc = re.sub(r'(defaultConfig\s*\{[^}]*\})', r'\1' + compile_block, c, count=1)
              if nc != c: write(fp, nc)
          print("✅ compileOptions Java 17")
          # ── 20. Gradle wrapper ────────────────────────────────────────
          GRADLE_VER = "8.9"
          run(f"wget -q https://services.gradle.org/distributions/gradle-{GRADLE_VER}-bin.zip -P /tmp")
          run(f"unzip -q /tmp/gradle-{GRADLE_VER}-bin.zip -d /tmp/gradle-inst")
          os.makedirs('/tmp/tmpwrapper', exist_ok=True)
          write('/tmp/tmpwrapper/settings.gradle', 'rootProject.name = "tmp"')
          run(
              f"/tmp/gradle-inst/gradle-{GRADLE_VER}/bin/gradle wrapper "
              f"--gradle-version {GRADLE_VER} --distribution-type bin "
              f"--project-dir /tmp/tmpwrapper"
          )
          shutil.copytree('/tmp/tmpwrapper/gradle', 'gradle', dirs_exist_ok=True)
          shutil.copy('/tmp/tmpwrapper/gradlew', 'gradlew')
          os.chmod('gradlew', 0o755)
          print("✅ Gradle wrapper")
          # ── 21. Build Debug APK ───────────────────────────────────────
          print("\n🔨 Building debug APK …")
          build_proc = subprocess.run(
              './gradlew :app:assembleDebug --no-daemon '
              '-Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"',
              shell=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True
          )
          rc = build_proc.returncode
          build_out = build_proc.stdout
          with open('/tmp/build_full.log', 'w') as f:
              f.write(build_out)
          lines = build_out.splitlines()
          print('\n'.join(lines[-300:]))
          if rc != 0:
              print("\n════ KOTLIN ERRORS ════")
              for line in lines:
                  if line.startswith('e: '):
                      print(line)
              print("\n════ TASK FAILURES ════")
              for line in lines:
                  if any(x in line for x in ['FAILED','Unresolved','Cannot access','not found','Caused by:']):
                      print(line)
              sys.exit(rc)
          apk = None
          for root, _, files in os.walk('app/build/outputs/apk/debug'):
              for f in files:
                  if f.endswith('.apk'):
                      apk = os.path.join(root, f); break
          if apk:
              print(f"\n✅ SUCCESS — APK: {apk} ({os.path.getsize(apk)//1_048_576} MB)")
          else:
              print("❌ APK not found!"); sys.exit(1)
          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
