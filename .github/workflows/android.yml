              implementation("com.google.firebase:firebase-analytics-ktx")
          }
          """))

          # ── 9. AndroidManifest.xml Cleanup ───────────────────────────
          main_mf = 'app/src/main/AndroidManifest.xml'
          if os.path.exists(main_mf):
              write(main_mf, re.sub(r'\s*package="[^"]*"', '', read(main_mf)))

          # ── 10. Assets Generator ───────────────────────────────────────
          write('app/src/main/res/values/themes.xml', '<resources><style name="Theme.WorldMondial" parent="Theme.AppCompat.DayNight.NoActionBar" /><style name="Theme.WorldMondial.NoActionBar" parent="Theme.WorldMondial" /></resources>')
          write('app/src/main/res/values/colors.xml', '<resources><color name="ic_launcher_background">#1565C0</color><color name="black">#000000</color><color name="white">#FFFFFF</color></resources>')
          write('app/src/main/res/drawable/ic_launcher_foreground.xml', '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M54,22 L70,54 L86,54 L73,66 L78,86 L54,74 L30,86 L35,66 L22,54 L38,54 Z"/></vector>')
          
          icon_xml = '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>'
          for d in ['mipmap-anydpi-v26', 'mipmap-anydpi']:
              write(f'app/src/main/res/{d}/ic_launcher.xml', icon_xml)
              write(f'app/src/main/res/{d}/ic_launcher_round.xml', icon_xml)

          for mod in ['core/common', 'core/di', 'core/network', 'core/database', 'core/data', 'core/domain', 'core/ui', 'core/testing', 'core/notifications', 'core/analytics', 'core/sync', 'feature/matches', 'feature/news', 'feature/settings']:
              mf = f'{mod}/src/main/AndroidManifest.xml'
              if not os.path.exists(mf): write(mf, '<?xml version="1.0" encoding="utf-8"?>\n<manifest />\n')

          # ── 11. Wrapper Engine ─────────────────────────────────────────
          GRADLE_VER = "8.9"
          subprocess.run(f"wget -q https://services.gradle.org/distributions/gradle-{GRADLE_VER}-bin.zip -P /tmp", shell=True, check=True)
          subprocess.run(f"unzip -q /tmp/gradle-{GRADLE_VER}-bin.zip -d /tmp/gradle-inst", shell=True, check=True)
          os.makedirs('/tmp/tmpwrapper', exist_ok=True)
          write('/tmp/tmpwrapper/settings.gradle', 'rootProject.name = "tmp"')
          subprocess.run(f"/tmp/gradle-inst/gradle-{GRADLE_VER}/bin/gradle wrapper --gradle-version {GRADLE_VER} --distribution-type bin --project-dir /tmp/tmpwrapper", shell=True, check=True)
          shutil.copytree('/tmp/tmpwrapper/gradle', 'gradle', dirs_exist_ok=True)
          shutil.copy('/tmp/tmpwrapper/gradlew', 'gradlew')

          # ── 12. Run Compilation ────────────────────────────────────────
          os.chmod('gradlew', 0o755)
          print("\n🔨 Building debug APK...")
          result = subprocess.run('./gradlew :app:assembleDebug --no-daemon', shell=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
          print(result.stdout)
          if result.returncode != 0: sys.exit(1)
          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
