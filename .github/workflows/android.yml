name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Ultimate Full Project Build
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap
          
          def read(p): 
              return open(p, encoding='utf-8').read() if os.path.exists(p) else ""
              
          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # 1. Safe Source Extraction
          print("📦 Extracting source code files...")
          content = read("project.txt")
          if not content:
              print("❌ project.txt is empty or missing!"); sys.exit(1)
              
          pattern = re.compile(r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)', re.DOTALL)
          count = 0
          for m in pattern.finditer(content):
              fp = m.group(1).strip().lstrip('/')
              body = m.group(2).rstrip('\n')
              write(fp, body)
              count += 1
          print(f"✅ Extracted {count} source files cleanly.")

          # 2. Master libs.versions.toml Configuration
          libs_toml = """
          [versions]
          kotlin               = "2.0.21"
          compose              = "1.7.5"
          material3            = "1.3.1"
          room                 = "2.7.1"
          hilt                 = "2.55"
          paging               = "3.3.2"
          androidGradlePlugin  = "8.7.2"
          ksp                  = "2.0.21-1.0.26"
          kotlinxSerialization = "1.6.3"
          androidxNavigation   = "2.8.4"
          timber               = "5.0.1"
          okhttp               = "4.12.0"
          retrofit             = "2.11.0"
          lifecycle            = "2.8.7"
          datastore            = "1.1.1"
          coil                 = "2.6.0"
          work                 = "2.9.1"
          junit                = "4.13.2"
          mockk                = "1.13.10"
          turbine              = "1.1.0"

          [libraries]
          androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui",                              version.ref = "compose"              }
          androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3",                       version.ref = "material3"            }
          androidx-navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",              version.ref = "androidxNavigation"   }
          kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",      version.ref = "kotlinxSerialization" }
          hilt-android                         = { group = "com.google.dagger",           name = "hilt-android",                    version.ref = "hilt"                 }
          hilt-compiler                        = { group = "com.google.dagger",           name = "hilt-compiler",                   version.ref = "hilt"                 }
          androidx-hilt-navigation-compose     = { group = "androidx.hilt",               name = "hilt-navigation-compose",         version = "1.2.0"                    }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",     version.ref = "lifecycle"            }
          androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",       version.ref = "lifecycle"            }
          timber                               = { group = "com.jakewharton.timber",      name = "timber",                          version.ref = "timber"               }
          kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",      version = "1.9.0"                    }
          kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",         version = "1.9.0"                    }
          kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",         version = "1.9.0"                    }
          retrofit-core                        = { group = "com.squareup.retrofit2",      name = "retrofit",                        version.ref = "retrofit"             }
          retrofit-kotlinx-serialization       = { group = "com.squareup.retrofit2",      name = "converter-kotlinx-serialization", version.ref = "retrofit"             }
          okhttp-logging                       = { group = "com.squareup.okhttp3",        name = "logging-interceptor",             version.ref = "okhttp"               }
          room-runtime                         = { group = "androidx.room",               name = "room-runtime",                    version.ref = "room"                 }
          room-ktx                             = { group = "androidx.room",               name = "room-ktx",                        version.ref = "room"                 }
          room-compiler                        = { group = "androidx.room",               name = "room-compiler",                   version.ref = "room"                 }
          androidx-datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",           version.ref = "datastore"            }
          coil-compose                         = { group = "io.coil-kt",                  name = "coil-compose",                    version.ref = "coil"                 }
          androidx-paging-runtime              = { group = "androidx.paging",             name = "paging-runtime",                  version.ref = "paging"               }
          androidx-paging-compose              = { group = "androidx.paging",             name = "paging-compose",                  version.ref = "paging"               }
          androidx-work-runtime                = { group = "androidx.work",               name = "work-runtime-ktx",                version.ref = "work"                 }
          androidx-work-multiprocess           = { group = "androidx.work",               name = "work-multiprocess",               version.ref = "work"                 }
          junit                                = { group = "junit",                       name = "junit",                           version.ref = "junit"                }
          mockk                                = { group = "io.mockk",                   name = "mockk",                           version.ref = "mockk"                }
          turbine                              = { group = "app.cash.turbine",            name = "turbine",                         version.ref = "turbine"              }
          androidx-test-rules                  = { group = "androidx.test",               name = "rules",                           version = "1.6.1"                    }

          [plugins]
          google-services      = { id = "com.google.gms.google-services",            version = "4.4.2"                   }
          android-application  = { id = "com.android.application",                   version.ref = "androidGradlePlugin" }
          android-library      = { id = "com.android.library",                       version.ref = "androidGradlePlugin" }
          kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin"              }
          kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin"              }
          kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"              }
          ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp"                 }
          hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt"                }
          """
          write('gradle/libs.versions.toml', textwrap.dedent(libs_toml))

          # 3. Master Root build.gradle.kts
          root_gradle = """
          plugins {
              alias(libs.plugins.android.application)  apply false
              alias(libs.plugins.android.library)      apply false
              alias(libs.plugins.kotlin.android)       apply false
              alias(libs.plugins.kotlin.compose)       apply false
              alias(libs.plugins.kotlin.serialization) apply false
              alias(libs.plugins.ksp)                  apply false
              alias(libs.plugins.hilt)                 apply false
              alias(libs.plugins.google.services)      apply false
          }
          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                      freeCompilerArgs.addAll(
                          "-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi",
                          "-opt-in=androidx.compose.material3.ExperimentalMaterial3Api",
                          "-opt-in=kotlinx.coroutines.FlowPreview"
                      )
                  }
              }
          }
          """
          write('build.gradle.kts', textwrap.dedent(root_gradle))

          # 4. Global Core Infrastructure Layout
          write('core/common/build.gradle.kts', textwrap.dedent("""
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.common"; compileSdk = 35; defaultConfig { minSdk = 26 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.timber) }
          """))

          write('core/domain/build.gradle.kts', textwrap.dedent("""
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization) }
          android { namespace = "sa.mondial.world.core.domain"; compileSdk = 35; defaultConfig { minSdk = 26 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.kotlinx.serialization.json) }
          """))

          write('core/database/build.gradle.kts', textwrap.dedent("""
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt); alias(libs.plugins.kotlin.serialization) }
          android { namespace = "sa.mondial.world.core.database"; compileSdk = 35; defaultConfig { minSdk = 26 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.room.runtime); implementation(libs.room.ktx); ksp(libs.room.compiler); implementation(libs.kotlinx.serialization.json); implementation(project(":core:common")); implementation(project(":core:domain")) }
          """))

          write('core/network/build.gradle.kts', textwrap.dedent("""
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.network"; compileSdk = 35; defaultConfig { minSdk = 26 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.retrofit.kotlinx.serialization); implementation(libs.kotlinx.serialization.json); implementation(libs.okhttp.logging); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:database")) }
          """))

          write('core/analytics/build.gradle.kts', textwrap.dedent("""
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.analytics"; compileSdk = 35; defaultConfig { minSdk = 26 } }
          dependencies { implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation("com.google.firebase:firebase-analytics:21.6.2"); implementation(libs.timber) }
          """))

          write('core/data/build.gradle.kts', textwrap.dedent("""
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.data"; compileSdk = 35; defaultConfig { minSdk = 26 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.androidx.datastore.preferences); implementation(libs.timber); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:database")); implementation(project(":core:network")); implementation(project(":core:analytics")) }
          """))

          write('core/notifications/build.gradle.kts', textwrap.dedent("""
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.notifications"; compileSdk = 35; defaultConfig { minSdk = 26 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.room.runtime); implementation(libs.room.ktx); implementation(libs.androidx.work.runtime); implementation(libs.androidx.work.multiprocess); implementation("com.google.firebase:firebase-messaging:23.4.0"); implementation("com.google.firebase:firebase-analytics:21.6.2"); implementation(libs.timber); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:database")); implementation(project(":core:data")); implementation(project(":core:analytics")) }
          """))

          # 5. Core UI, Sync, and Testing Setup
          for m, ns in [('core/ui', 'sa.mondial.world.core.ui'), ('core/sync', 'sa.mondial.world.core.sync'), ('core/testing', 'sa.mondial.world.core.testing')]:
              write(f'{m}/build.gradle.kts', textwrap.dedent(f"""
              plugins {{ alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android) }}
              android {{ namespace = "{ns}"; compileSdk = 35; defaultConfig {{ minSdk = 26 }} }}
              dependencies {{ implementation(libs.kotlinx.coroutines.core) }}
              """))

          # 6. Comprehensive Features Modules Injection
          feature_template = """
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.feature.%s"; compileSdk = 35; defaultConfig { minSdk = 26 }; buildFeatures { compose = true } }
          dependencies {
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.androidx.hilt.navigation-compose)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.lifecycle.runtime-compose)
              implementation(libs.timber)
              implementation(libs.coil-compose)
              implementation(libs.androidx.paging.runtime)
              implementation(libs.androidx.paging.compose)
              implementation(project(":core:common"))
              implementation(project(":core:domain"))
              implementation(project(":core:database"))
              implementation(project(":core:network"))
              implementation(project(":core:data"))
              implementation(project(":core:analytics"))
          }
          """
          for f_name in ['matches', 'news', 'settings']:
              write(f'feature/{f_name}/build.gradle.kts', textwrap.dedent(feature_template % f_name))

          # 7. Complete App Module Architecture
          app_gradle = """
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
              alias(libs.plugins.google.services)
          }
          android {
              namespace = "sa.mondial.world"
              compileSdk = 35
              defaultConfig {
                  applicationId = "sa.mondial.world"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              buildFeatures { compose = true }
          }
          dependencies {
              implementation(project(":core:common"))
              implementation(project(":core:domain"))
              implementation(project(":core:database"))
              implementation(project(":core:network"))
              implementation(project(":core:data"))
              implementation(project(":core:analytics"))
              implementation(project(":core:notifications"))
              implementation(project(":core:sync"))
              implementation(project(":core:ui"))
              implementation(project(":feature:matches"))
              implementation(project(":feature:news"))
              implementation(project(":feature:settings"))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("com.google.android.material:material:1.12.0")
          }
          """
          write('app/build.gradle.kts', textwrap.dedent(app_gradle))

          # 8. Essential Code Fixes (Syntax & Accessibility)
          mds = 'feature/matches/src/main/java/sa/mondial/world/feature/matches/presentation/MatchDetailsScreen.kt'
          if os.path.exists(mds):
              write(mds, read(mds).replace('\r\n', '\n')
                    .replace('"🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"', '"""🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"""')
                    .replace('"🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"', '"""🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"""'))

          br = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(br):
              write(br, read(br).replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker'))

          # 9. Executable Permissions Enforcement
          os.chmod('gradlew', stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH | stat.S_IRUSR | stat.S_IWUSR)
          
          print("\n🔨 Launching final clean build task...")
          subprocess.run(['./gradlew', ':app:assembleDebug', '--no-daemon'], check=True)
          print("✅ SUCCESS")
          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
