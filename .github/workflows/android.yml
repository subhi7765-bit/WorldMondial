name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Project & Build APK
        run: |
          python3 - << 'PYEOF'
          import os, re, sys, subprocess, shutil

          def run(cmd):
              print(f"→ {cmd}")
              r = subprocess.run(cmd, shell=True, text=True, capture_output=True)
              print(r.stdout[-800:] if len(r.stdout) > 800 else r.stdout)
              if r.stderr: print("STDERR:", r.stderr[-600:])
              if r.returncode != 0:
                  print(f"❌ Failed: {cmd}")
                  sys.exit(r.returncode)

          # 1. Extract from project.txt if exists
          if os.path.exists('project.txt'):
              print("📦 Extracting from project.txt...")
              content = open('project.txt', encoding='utf-8').read()
              pattern = re.compile(r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)', re.DOTALL)
              count = 0
              for m in pattern.finditer(content):
                  fp = m.group(1).strip().lstrip('/')
                  body = m.group(2).rstrip('\n')
                  if fp:
                      os.makedirs(os.path.dirname(fp), exist_ok=True)
                      open(fp, 'w', encoding='utf-8').write(body)
                      count += 1
              print(f"✅ Extracted {count} files from project.txt")

          # 2. Ensure Gradle Wrapper
          run("chmod +x gradlew")

          # 3. Build
          print("🔨 Building Debug APK...")
          run("./gradlew :app:assembleDebug --stacktrace --no-daemon")

          # 4. Show generated files
          print("\n📁 APK Search Result:")
          run("find app/build/outputs -name '*.apk' -type f")
          run("ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo 'No debug folder'")

          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldMondial-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
