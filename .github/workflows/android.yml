name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix & Build Debug APK
        run: |
          python3 - << 'PYEOF'
          import os, re, sys, subprocess

          def run(cmd):
              print(f"→ {cmd}")
              r = subprocess.run(cmd, shell=True, text=True, capture_output=True)
              print(r.stdout[-1200:] if len(r.stdout) > 1200 else r.stdout)
              if r.stderr: print("STDERR:", r.stderr[-800:])
              if r.returncode != 0:
                  print(f"❌ Failed with {r.returncode}")
                  sys.exit(r.returncode)

          # Basic fixes for common issues
          run("chmod +x gradlew")

          # Build with more verbose output
          print("🔨 Building :app:assembleDebug ...")
          run("./gradlew :app:assembleDebug --stacktrace --no-daemon --info | tail -n 300")

          # List all generated APKs for debugging
          print("\n📁 Generated APK files:")
          run("find app/build/outputs -name '*.apk' | head -20")

          PYEOF

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorldMondial-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
