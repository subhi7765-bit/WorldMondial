name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt', 'app/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Execute Enterprise Gradle Build Engine
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap

          def read(p):
              if os.path.exists(p):
                  with open(p, encoding='utf-8') as f: return f.read()
              return ""

          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # 1. Safe Source Extraction
          src = "project.txt"
          if os.path.exists(src) and len(read(src)) > 100:
              print("📦 Extracting structure from project.txt master file...")
              content = read(src)
              pattern = re.compile(r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)', re.DOTALL)
              for m in pattern.finditer(content):
                  write(m.group(1).strip().lstrip('/'), m.group(2).rstrip('\n'))
              print("✅ Extraction complete.")
          else:
              print("🚀 Using existing multi-module repository structure directly.")

          # 2. Re-write libs.versions.toml with precise dot-notation mappings for Gradle 9+
          libs_toml = """
          [versions]
          kotlin               = "2.0.21"
          compose              = "1.7.5"
          material3            = "1.3.1"
          room                 = "2.7.1"
          hilt                 = "2.55"
          paging               = "3.3.2"
          androidGradlePlugin  = "8.7.2"
          ksp                  = "2.0.21-1.0.26"
          kotlinxSerialization = "1.6.3"
          androidxNavigation   = "2.8.4"
          timber               = "5.0.1"
          okhttp               = "4.12.0"
          retrofit             = "2.11.0"
          lifecycle            = "2.8.7"
          datastore            = "1.1.1"
          coil                 = "2.6.0"
          work                 = "2.9.1"
          junit                = "4.13.2"
          mockk                = "1.13.10"
          turbine              = "1.1.0"

          [libraries]
          androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui",                              version.ref = "compose"              }
          androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3",                       version.ref = "material3"            }
          androidx-navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",              version.ref = "androidxNavigation"   }
          kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",      version.ref = "kotlinxSerialization" }
          hilt-android                         = { group = "com.google.dagger",           name = "hilt-android",                    version.ref = "hilt"                 }
          hilt-compiler                        = { group = "com.google.dagger",           name = "hilt-compiler",                   version.ref = "hilt"                 }
          timber                               = { group = "com.jakewharton.timber",      name = "timber",                          version.ref = "timber"               }
          kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",      version = "1.9.0"                    }
          kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",         version = "1.9.0"                    }
          kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",         version = "1.9.0"                    }
          retrofit-core                        = { group = "com.squareup.retrofit2",      name = "retrofit",                        version.ref = "retrofit"             }
          retrofit-kotlinx-serialization       = { group = "com.squareup.retrofit2",      name = "converter-kotlinx-serialization", version.ref = "retrofit"             }
          okhttp-logging                       = { group = "com.squareup.okhttp3",        name = "logging-interceptor",             version.ref = "okhttp"               }
          room-runtime                         = { group = "androidx.room",               name = "room-runtime",                    version.ref = "room"                 }
          room-ktx                             = { group = "androidx.room",               name = "room-ktx",                        version.ref = "room"                 }
          room-compiler                        = { group = "androidx.room",               name = "room-compiler",                   version.ref = "room"                 }
          androidx-datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",           version.ref = "datastore"            }
          coil-compose                         = { group = "io.coil-kt",                  name = "coil-compose",                    version.ref = "coil"                 }
          androidx-paging-runtime              = { group = "androidx.paging",             name = "paging-runtime",                  version.ref = "paging"               }
          androidx-paging-compose              = { group = "androidx.paging",             name = "paging-compose",                  version.ref = "paging"               }
          material-icons-extended              = { group = "androidx.compose.material",   name = "material-icons-extended",         version.ref = "compose"              }
          androidx-appcompat                   = { group = "androidx.appcompat",          name = "appcompat",                       version = "1.7.0"                    }

          [plugins]
          google-services      = { id = "com.google.gms.google-services",            version = "4.4.2"                   }
          android-application  = { id = "com.android.application",                   version.ref = "androidGradlePlugin" }
          android-library      = { id = "com.android.library",                       version.ref = "androidGradlePlugin" }
          kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin"              }
          kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin"              }
          kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"              }
          ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp"                 }
          hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt"                }
          """
          write('gradle/libs.versions.toml', textwrap.dedent(libs_toml))

          # 2. Write clean root build.gradle.kts
          root_gradle = """
          plugins {
              alias(libs.plugins.android.application)  apply false
              alias(libs.plugins.android.library)      apply false
              alias(libs.plugins.kotlin.android)       apply false
              alias(libs.plugins.kotlin.compose)       apply false
              alias(libs.plugins.kotlin.serialization) apply false
              alias(libs.plugins.ksp)                  apply false
              alias(libs.plugins.hilt)                 apply false
              alias(libs.plugins.google.services)      apply false
          }
          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }
          """
          write('build.gradle.kts', textwrap.dedent(root_gradle))

          # 3. Generate Core Module Infrastructure
          write('core/common/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.common"; compileSdk = 35; defaultConfig { minSdk = 26 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.timber) }')
          write('core/domain/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization) }\nandroid { namespace = "sa.mondial.world.core.domain"; compileSdk = 35; defaultConfig { minSdk = 26 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.kotlinx.serialization.json) }')
          write('core/database/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt); alias(libs.plugins.kotlin.serialization) }\nandroid { namespace = "sa.mondial.world.core.database"; compileSdk = 35; defaultConfig { minSdk = 26 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.room.runtime); implementation(libs.room.ktx); ksp(libs.room.compiler); implementation(libs.kotlinx.serialization.json); implementation(project(":core:common")); implementation(project(":core:domain")) }')
          write('core/network/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.network"; compileSdk = 35; defaultConfig { minSdk = 26 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.retrofit.kotlinx.serialization); implementation(libs.kotlinx.serialization.json); implementation(libs.okhttp.logging); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:database")) }')
          write('core/analytics/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.analytics"; compileSdk = 35; defaultConfig { minSdk = 26 } }\ndependencies { implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation("com.google.firebase:firebase-analytics:21.6.2"); implementation(libs.timber) }')
          write('core/data/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.data"; compileSdk = 35; defaultConfig { minSdk = 26 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.androidx.datastore.preferences); implementation(libs.timber); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:database")); implementation(project(":core:network")); implementation(project(":core:analytics")) }')
          write('core/notifications/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }\nandroid { namespace = "sa.mondial.world.core.notifications"; compileSdk = 35; defaultConfig { minSdk = 26 } }\ndependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.room.runtime); implementation(libs.room.ktx); implementation("androidx.work:work-runtime-ktx:2.9.1"); implementation("androidx.work:work-multiprocess:2.9.1"); implementation("com.google.firebase:firebase-messaging:24.0.0"); implementation(libs.timber); implementation(project(":core:common")); implementation(project(":core:domain")); implementation(project(":core:database")); implementation(project(":core:data")); implementation(project(":core:analytics")) }')
          
          # 4. Generate core/ui with compose plugin applied explicitly
          write('core/ui/build.gradle.kts', 'plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.compose) }\nandroid { namespace = "sa.mondial.world.core.ui"; compileSdk = 35; defaultConfig { minSdk = 26 }; buildFeatures { compose = true } }\ndependencies { implementation(libs.androidx.compose.ui); implementation(libs.androidx.compose.material3) }')

          for m, ns in [('core/sync', 'sa.mondial.world.core.sync'), ('core/testing', 'sa.mondial.world.core.testing'), ('core/di', 'sa.mondial.world.core.di')]:
              write(f'{m}/build.gradle.kts', f'plugins {{ alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android) }}\nandroid {{ namespace = "{ns}"; compileSdk = 35; defaultConfig {{ minSdk = 26 }} }}')

          # 5. Clean Feature Modules Structure with mandatory kotlin-compose compiler plugin applied
          feature_template = """
          plugins { 
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
          }
          android { namespace = "sa.mondial.world.feature.%s"; compileSdk = 35; defaultConfig { minSdk = 26 }; buildFeatures { compose = true } }
          dependencies {
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.timber)
              implementation(libs.coil.compose)
              implementation(libs.androidx.paging.runtime)
              implementation(libs.androidx.paging.compose)
              implementation(project(":core:common"))
              implementation(project(":core:domain"))
              implementation(project(":core:database"))
              implementation(project(":core:network"))
              implementation(project(":core:data"))
              implementation(project(":core:analytics"))
          }
          """
          for f_name in ['matches', 'news', 'settings']:
              write(f'feature/{f_name}/build.gradle.kts', textwrap.dedent(feature_template % f_name))

          # 6. Perfect app module structure with applied Google Services
          app_gradle = """
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
              alias(libs.plugins.kotlin.serialization)
              alias(libs.plugins.google.services)
          }
          android {
              namespace = "sa.mondial.world"
              compileSdk = 35
              defaultConfig {
                  applicationId = "sa.mondial.world"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 100
                  versionName = "1.0.0"
                  testInstrumentationRunner = "sa.mondial.world.core.testing.CustomTestRunner"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              buildFeatures { compose = true; buildConfig = true }
          }
          dependencies {
              implementation(project(":core:common"))
              implementation(project(":core:di"))
              implementation(project(":core:ui"))
              implementation(project(":core:data"))
              implementation(project(":core:domain"))
              implementation(project(":core:database"))
              implementation(project(":core:network"))
              implementation(project(":core:analytics"))
              implementation(project(":core:notifications"))
              implementation(project(":feature:matches"))
              implementation(project(":feature:news"))
              implementation(project(":feature:settings"))
              implementation(project(":core:sync"))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.kotlinx.serialization.json)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.timber)
              implementation("androidx.work:work-runtime-ktx:2.9.1")
              implementation("com.google.firebase:firebase-messaging:24.0.0")
              implementation("com.google.firebase:firebase-crashlytics:19.0.0")
              implementation(platform("com.google.firebase:firebase-bom:33.10.0"))
              implementation("com.google.firebase:firebase-analytics-ktx")
          }
          """
          write('app/build.gradle.kts', textwrap.dedent(app_gradle))

          # 7. Code Fixes
          mds = 'feature/matches/src/main/java/sa/mondial/world/feature/matches/presentation/MatchDetailsScreen.kt'
          if os.path.exists(mds):
              write(mds, read(mds).replace('\r\n', '\n')
                    .replace('"🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"', '"""🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"""')
                    .replace('"🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"', '"""🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"""'))

          br = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(br):
              write(br, read(br).replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker'))

          # 8. Set Permissions & Run
          os.chmod('gradlew', stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH | stat.S_IRUSR | stat.S_IWUSR)
          print("\n🔨 Executing Clean Build Sequence...")
          subprocess.run(['./gradlew', ':app:assembleDebug', '--no-daemon'], check=True)
          print("✅ SUCCESS")
          PYEOF

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
