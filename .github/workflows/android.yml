name: Build World Mondial Modular APK

# Configured to execute strictly on manual trigger requests to prevent automated background usage
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Inject Football API Key into Local Properties
        run: |
          echo "football.api.key=${{ secrets.FOOTBALL_API_KEY }}" >> local.properties
          echo "FOOTBALL_API_KEY=${{ secrets.FOOTBALL_API_KEY }}" >> local.properties

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Assemble Production Debug APK Bundle
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Archive and Upload Compiled Modular Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WorldMondial-Modular-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
