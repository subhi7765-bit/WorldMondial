name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['project.txt', 'app/**']

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Execute Enterprise Gradle Build Engine
        run: |
          python3 << 'PYEOF'
          import os, re, sys, subprocess, shutil, stat, textwrap

          def read(p):
              if os.path.exists(p):
                  with open(p, encoding='utf-8') as f: return f.read()
              return ""

          def write(p, c):
              d = os.path.dirname(p)
              if d: os.makedirs(d, exist_ok=True)
              with open(p, 'w', encoding='utf-8') as f: f.write(c)

          # 1. Safe Source Extraction
          src = "project.txt"
          if os.path.exists(src) and len(read(src)) > 100:
              print("📦 Extracting structure from project.txt master file...")
              content = read(src)
              pattern = re.compile(r'-{3,}\s*\nFILE TARGET:\s*(/[^\n]+)\n-{3,}\s*\n(.*?)(?=\n-{3,}\s*\nFILE TARGET:|\Z)', re.DOTALL)
              for m in pattern.finditer(content):
                  write(m.group(1).strip().lstrip('/'), m.group(2).rstrip('\n'))
              print("✅ Extraction complete.")
          else:
              print("🚀 Using existing multi-module repository structure directly.")

          # 2. google-services.json
          google_json = """{
            "project_info":{
              "project_number":"940789403342",
              "project_id":"world-mondial",
              "storage_bucket":"world-mondial.firebasestorage.app"
            },
            "client":[{
              "client_info":{
                "mobilesdk_app_id":"1:940789403342:android:088eaf9d6bdb4a3e9e4a9f",
                "android_client_info":{"package_name":"sa.mondial.world"}
              },
              "oauth_client":[],
              "api_key":[{"current_key":"AIzaSyD5QcgMhaHvVkvChUqEVlArCwAO9F84RF0"}],
              "services":{"appinvite_service":{"other_platform_oauth_client":[]}}
            }],
            "configuration_version":"1"
          }"""
          write('app/google-services.json', textwrap.dedent(google_json))
          print("✅ google-services.json")

          # 3. libs.versions.toml
          libs_toml = """
          [versions]
          kotlin               = "2.0.21"
          compose              = "1.7.5"
          material3            = "1.3.1"
          room                 = "2.7.1"
          hilt                 = "2.55"
          paging               = "3.3.2"
          androidGradlePlugin  = "8.7.2"
          ksp                  = "2.0.21-1.0.26"
          kotlinxSerialization = "1.6.3"
          androidxNavigation   = "2.8.4"
          timber               = "5.0.1"
          okhttp               = "4.12.0"
          retrofit             = "2.11.0"
          lifecycle            = "2.8.7"
          datastore            = "1.1.1"
          coil                 = "2.6.0"
          work                 = "2.9.1"
          junit                = "4.13.2"
          mockk                = "1.13.10"
          turbine              = "1.1.0"

          [libraries]
          androidx-compose-ui                  = { group = "androidx.compose.ui",        name = "ui",                              version.ref = "compose"              }
          androidx-compose-material3           = { group = "androidx.compose.material3", name = "material3",                       version.ref = "material3"            }
          androidx-navigation-compose          = { group = "androidx.navigation",         name = "navigation-compose",              version.ref = "androidxNavigation"   }
          kotlinx-serialization-json           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-serialization-json",      version.ref = "kotlinxSerialization" }
          hilt-android                         = { group = "com.google.dagger",           name = "hilt-android",                    version.ref = "hilt"                 }
          hilt-compiler                        = { group = "com.google.dagger",           name = "hilt-compiler",                   version.ref = "hilt"                 }
          androidx-hilt-navigation-compose     = { group = "androidx.hilt",               name = "hilt-navigation-compose",         version = "1.2.0"                    }
          androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle",          name = "lifecycle-viewmodel-compose",     version.ref = "lifecycle"            }
          androidx-lifecycle-runtime-compose   = { group = "androidx.lifecycle",          name = "lifecycle-runtime-compose",       version.ref = "lifecycle"            }
          timber                               = { group = "com.jakewharton.timber",      name = "timber",                          version.ref = "timber"               }
          kotlinx-coroutines-android           = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-android",      version = "1.9.0"                    }
          kotlinx-coroutines-core              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-core",         version = "1.9.0"                    }
          kotlinx-coroutines-test              = { group = "org.jetbrains.kotlinx",       name = "kotlinx-coroutines-test",         version = "1.9.0"                    }
          retrofit-core                        = { group = "com.squareup.retrofit2",      name = "retrofit",                        version.ref = "retrofit"             }
          retrofit-kotlinx-serialization       = { group = "com.squareup.retrofit2",      name = "converter-kotlinx-serialization", version.ref = "retrofit"             }
          okhttp-logging                       = { group = "com.squareup.okhttp3",        name = "logging-interceptor",             version.ref = "okhttp"               }
          room-runtime                         = { group = "androidx.room",               name = "room-runtime",                    version.ref = "room"                 }
          room-ktx                             = { group = "androidx.room",               name = "room-ktx",                        version.ref = "room"                 }
          room-compiler                        = { group = "androidx.room",               name = "room-compiler",                   version.ref = "room"                 }
          androidx-datastore-preferences       = { group = "androidx.datastore",          name = "datastore-preferences",           version.ref = "datastore"            }
          coil-compose                         = { group = "io.coil-kt",                  name = "coil-compose",                    version.ref = "coil"                 }
          androidx-paging-runtime              = { group = "androidx.paging",             name = "paging-runtime",                  version.ref = "paging"               }
          androidx-paging-compose              = { group = "androidx.paging",             name = "paging-compose",                  version.ref = "paging"               }
          material-icons-extended              = { group = "androidx.compose.material",   name = "material-icons-extended",         version.ref = "compose"              }
          androidx-appcompat                   = { group = "androidx.appcompat",          name = "appcompat",                       version = "1.7.0"                    }
          junit                                = { group = "junit",                       name = "junit",                           version.ref = "junit"                }
          mockk                                = { group = "io.mockk",                   name = "mockk",                           version.ref = "mockk"                }
          turbine                              = { group = "app.cash.turbine",            name = "turbine",                         version.ref = "turbine"              }

          [plugins]
          google-services      = { id = "com.google.gms.google-services",            version = "4.4.2"                   }
          android-application  = { id = "com.android.application",                   version.ref = "androidGradlePlugin" }
          android-library      = { id = "com.android.library",                       version.ref = "androidGradlePlugin" }
          kotlin-android       = { id = "org.jetbrains.kotlin.android",              version.ref = "kotlin"              }
          kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin"              }
          kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin"              }
          ksp                  = { id = "com.google.devtools.ksp",                   version.ref = "ksp"                 }
          hilt                 = { id = "com.google.dagger.hilt.android",            version.ref = "hilt"                }
          """
          write('gradle/libs.versions.toml', textwrap.dedent(libs_toml))
          print("✅ libs.versions.toml")

          # 4. Root build.gradle.kts
          root_gradle = """
          plugins {
              alias(libs.plugins.android.application)  apply false
              alias(libs.plugins.android.library)      apply false
              alias(libs.plugins.kotlin.android)       apply false
              alias(libs.plugins.kotlin.compose)       apply false
              alias(libs.plugins.kotlin.serialization) apply false
              alias(libs.plugins.ksp)                  apply false
              alias(libs.plugins.hilt)                 apply false
              alias(libs.plugins.google.services)      apply false
          }
          subprojects {
              tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
                  compilerOptions {
                      jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
                  }
              }
          }
          """
          write('build.gradle.kts', textwrap.dedent(root_gradle))
          print("✅ root build.gradle.kts")

          # 5. Core modules
          write('core/common/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.common"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.timber) }
          """))

          write('core/domain/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization) }
          android { namespace = "sa.mondial.world.core.domain"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.kotlinx.serialization.json) }
          """))

          # core:database needs core:domain (MatchEntity/NewsEntity import domain models)
          write('core/database/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt); alias(libs.plugins.kotlin.serialization) }
          android { namespace = "sa.mondial.world.core.database"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.room.runtime); implementation(libs.room.ktx); ksp(libs.room.compiler); implementation(libs.kotlinx.serialization.json); implementation(project(":core:common")); implementation(project(":core:domain")) }
          """))

          # core:network only needs core:common (no domain/database)
          write('core/network/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.serialization); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.network"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.retrofit.core); implementation(libs.retrofit.kotlinx.serialization); implementation(libs.kotlinx.serialization.json); implementation(libs.okhttp.logging); implementation(project(":core:common")) }
          """))

          # core:analytics uses Firebase BOM (NOT hardcoded version)
          write('core/analytics/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.analytics"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.timber); implementation(platform("com.google.firebase:firebase-bom:33.10.0")); implementation("com.google.firebase:firebase-analytics-ktx") }
          """))

          # core:data needs analytics (AnalyticsTracker) + crashlytics (BaseRepository) + core:di
          write('core/data/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.data"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(libs.androidx.datastore.preferences); implementation(libs.timber); implementation(project(":core:common")); implementation(project(":core:di")); implementation(project(":core:domain")); implementation(project(":core:database")); implementation(project(":core:network")); implementation(project(":core:analytics")); implementation(platform("com.google.firebase:firebase-bom:33.10.0")); implementation("com.google.firebase:firebase-crashlytics") }
          """))

          # core:notifications needs core:data (LocalizationManager) + core:analytics (AnalyticsTracker)
          write('core/notifications/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.notifications"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.kotlinx.coroutines.core); implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation("androidx.work:work-runtime-ktx:2.9.1"); implementation(libs.timber); implementation(project(":core:common")); implementation(project(":core:data")); implementation(project(":core:analytics")); implementation(platform("com.google.firebase:firebase-bom:33.10.0")); implementation("com.google.firebase:firebase-messaging-ktx") }
          """))
          print("✅ core modules")

          # 6. core/ui
          write('core/ui/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.kotlin.compose) }
          android { namespace = "sa.mondial.world.core.ui"; compileSdk = 35; defaultConfig { minSdk = 26 }; buildFeatures { compose = true }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.androidx.compose.ui); implementation(libs.androidx.compose.material3) }
          """))

          # core/di needs hilt (ConnectivityModule uses @Binds/@Module)
          write('core/di/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.di"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation(project(":core:common")) }
          """))

          # core/sync needs work + network + feature:news (MatchSyncWorker)
          write('core/sync/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android); alias(libs.plugins.ksp); alias(libs.plugins.hilt) }
          android { namespace = "sa.mondial.world.core.sync"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.hilt.android); ksp(libs.hilt.compiler); implementation("androidx.work:work-runtime-ktx:2.9.1"); implementation(project(":core:common")); implementation(project(":core:data")); implementation(project(":core:network")); implementation(project(":core:domain")) }
          """))

          # core/testing
          write('core/testing/build.gradle.kts', textwrap.dedent("""\
          plugins { alias(libs.plugins.android.library); alias(libs.plugins.kotlin.android) }
          android { namespace = "sa.mondial.world.core.testing"; compileSdk = 35; defaultConfig { minSdk = 26 }; compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 } }
          dependencies { implementation(libs.junit); implementation(libs.mockk); implementation(libs.turbine); implementation(libs.kotlinx.coroutines.test) }
          """))
          print("✅ support modules (di, sync, testing, ui)")

          # 7. Feature modules
          feature_template = """
          plugins {
              alias(libs.plugins.android.library)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
          }
          android {
              namespace = "sa.mondial.world.feature.%s"
              compileSdk = 35
              defaultConfig { minSdk = 26 }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          dependencies {
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.androidx.hilt.navigation.compose)
              implementation(libs.androidx.lifecycle.viewmodel.compose)
              implementation(libs.androidx.lifecycle.runtime.compose)
              implementation(libs.timber)
              implementation(libs.coil.compose)
              implementation(libs.androidx.paging.runtime)
              implementation(libs.androidx.paging.compose)
              implementation(project(":core:common"))
              implementation(project(":core:domain"))
              implementation(project(":core:database"))
              implementation(project(":core:network"))
              implementation(project(":core:data"))
              implementation(project(":core:analytics"))
              implementation(project(":core:ui"))
          }
          """
          for f_name in ['matches', 'news', 'settings']:
              write(f'feature/{f_name}/build.gradle.kts', textwrap.dedent(feature_template % f_name))
          print("✅ feature modules")

          # 8. app/build.gradle.kts  — FIX: removed :project:database typo, Firebase uses BOM
          app_gradle = """
          plugins {
              alias(libs.plugins.android.application)
              alias(libs.plugins.kotlin.android)
              alias(libs.plugins.kotlin.compose)
              alias(libs.plugins.ksp)
              alias(libs.plugins.hilt)
              alias(libs.plugins.kotlin.serialization)
              alias(libs.plugins.google.services)
          }
          android {
              namespace = "sa.mondial.world"
              compileSdk = 35
              defaultConfig {
                  applicationId = "sa.mondial.world"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 100
                  versionName = "1.0.0"
                  testInstrumentationRunner = "sa.mondial.world.core.testing.CustomTestRunner"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              buildFeatures { compose = true; buildConfig = true }
          }
          dependencies {
              implementation(project(":core:common"))
              implementation(project(":core:di"))
              implementation(project(":core:ui"))
              implementation(project(":core:data"))
              implementation(project(":core:database"))
              implementation(project(":core:network"))
              implementation(project(":core:analytics"))
              implementation(project(":core:notifications"))
              implementation(project(":feature:matches"))
              implementation(project(":feature:news"))
              implementation(project(":feature:settings"))
              implementation(project(":core:sync"))
              implementation(libs.androidx.compose.ui)
              implementation(libs.androidx.compose.material3)
              implementation(libs.androidx.navigation.compose)
              implementation(libs.kotlinx.serialization.json)
              implementation(libs.hilt.android)
              ksp(libs.hilt.compiler)
              implementation(libs.timber)
              implementation("androidx.work:work-runtime-ktx:2.9.1")
              implementation(platform("com.google.firebase:firebase-bom:33.10.0"))
              implementation("com.google.firebase:firebase-messaging-ktx")
              implementation("com.google.firebase:firebase-crashlytics")
              implementation("com.google.firebase:firebase-analytics-ktx")
          }
          """
          write('app/build.gradle.kts', textwrap.dedent(app_gradle))
          print("✅ app/build.gradle.kts")

          # 9. Code Fixes
          # Fix AuthRepository.kt: imports placed after interface (invalid Kotlin)
          write('core/network/src/main/java/sa/mondial/world/core/network/AuthRepository.kt',
              textwrap.dedent("""\
              package sa.mondial.world.core.network

              import dagger.Binds
              import dagger.Module
              import dagger.hilt.InstallIn
              import dagger.hilt.components.SingletonComponent
              import javax.inject.Inject
              import javax.inject.Singleton

              interface AuthRepository {
                  suspend fun refreshToken(): String?
              }

              @Singleton
              class AuthRepositoryImpl @Inject constructor() : AuthRepository {
                  override suspend fun refreshToken(): String? = "new_access_token_xyz987"
              }

              @Module
              @InstallIn(SingletonComponent::class)
              abstract class AuthModule {
                  @Binds @Singleton
                  abstract fun bindAuthRepository(impl: AuthRepositoryImpl): AuthRepository
              }
              """))

          # Fix AppError.kt: Database.message missing override keyword
          ae = 'core/common/src/main/java/sa/mondial/world/core/common/AppError.kt'
          if os.path.exists(ae):
              c = read(ae)
              c = re.sub(r'data class Network\(val code: Int, (?:override )?val message: String\?\)',
                         'data class Network(val code: Int, override val message: String?)', c)
              c = re.sub(r'data class Database\((?:override )?val message: String,',
                         'data class Database(override val message: String,', c)
              write(ae, c)

          # Fix MatchDetailsScreen.kt: raw string in double-quoted string (invalid Kotlin)
          mds = 'feature/matches/src/main/java/sa/mondial/world/feature/matches/presentation/MatchDetailsScreen.kt'
          if os.path.exists(mds):
              write(mds, read(mds).replace('\r\n', '\n')
                    .replace('"🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"',
                             '"""🏆 $homeTeam × $awayTeam\n⚽ النتيجة: $homeScore-$awayScore\n📅 التاريخ: $date\n🏟️ الملعب: $venue"""')
                    .replace('"🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"',
                             '"""🏆 $homeTeam vs $awayTeam\n⚽ Score: $homeScore-$awayScore\n📅 Date: $date\n🏟️ Venue: $venue"""'))

          # Fix BaseRepository.kt: protected lateinit visibility issue
          br = 'core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt'
          if os.path.exists(br):
              write(br, read(br).replace('protected lateinit var analyticsTracker', 'lateinit var analyticsTracker'))

          # Ensure AndroidManifest.xml exists for all library modules
          for mod in ['core/common','core/di','core/network','core/database','core/data',
                      'core/domain','core/ui','core/testing','core/notifications',
                      'core/analytics','core/sync','feature/matches','feature/news','feature/settings']:
              mf = f'{mod}/src/main/AndroidManifest.xml'
              if not os.path.exists(mf):
                  write(mf, '<?xml version="1.0" encoding="utf-8"?>\n<manifest />\n')
          print("✅ Code fixes + manifests")

          # 10. Set Permissions & Run
          os.chmod('gradlew', stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH | stat.S_IRUSR | stat.S_IWUSR)
          print("\n🔨 Executing Clean Build Sequence...")
          result = subprocess.run(
              ['./gradlew', ':app:assembleDebug', '--no-daemon',
               '-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g'],
              capture_output=True, text=True
          )
          print(result.stdout[-8000:] if len(result.stdout) > 8000 else result.stdout)
          if result.returncode != 0:
              print("── ERRORS ──")
              for line in result.stdout.splitlines() + result.stderr.splitlines():
                  if any(x in line for x in ['e: ','FAILED','Unresolved','Cannot access','not found','Caused by:']):
                      print(line)
              sys.exit(result.returncode)
          print("✅ SUCCESS")
          PYEOF

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
