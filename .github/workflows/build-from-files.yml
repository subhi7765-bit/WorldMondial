name: Build World Mondial Debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'project.txt'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Make Gradle Executable
        run: chmod +x ./gradlew

      - name: Apply Hotfixes (Critical Fixes)
        run: |
          echo "🔧 Applying critical hotfixes..."

          # FIX-1: BaseRepository visibility
          if [ -f "core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt" ]; then
            sed -i 's/protected lateinit var analyticsTracker/lateinit var analyticsTracker/g' core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt
            sed -i 's/internal lateinit var analyticsTracker/lateinit var analyticsTracker/g' core/data/src/main/java/sa/mondial/world/core/data/BaseRepository.kt
            echo "✅ FIX-1: BaseRepository visibility fixed"
          fi

          # FIX-2: DatabaseModule Room
          if [ -f "core/database/src/main/java/sa/mondial/world/core/database/di/DatabaseModule.kt" ]; then
            sed -i 's/\.fallbackToDestructiveMigration()/\.fallbackToDestructiveMigration(dropAllTables = true)/g' core/database/src/main/java/sa/mondial/world/core/database/di/DatabaseModule.kt
            echo "✅ FIX-2: DatabaseModule updated"
          fi

          # FIX-3: AppError overrides
          if [ -f "core/common/src/main/java/sa/mondial/world/core/common/AppError.kt" ]; then
            sed -i 's/val message: String\?/override val message: String?/g' core/common/src/main/java/sa/mondial/world/core/common/AppError.kt
            echo "✅ FIX-3: AppError.kt fixed"
          fi

          # FIX-4: Remove package= from main manifest (AGP 8+)
          if [ -f "app/src/main/AndroidManifest.xml" ]; then
            sed -i '/package="/d' app/src/main/AndroidManifest.xml
            echo "✅ FIX-4: Manifest package attribute removed"
          fi

      - name: Check Project Structure
        run: |
          echo "📁 Project files:"
          ls -la
          echo "📁 App folder:"
          ls -la app
          echo "📁 Core modules:"
          ls -la core/
          echo "📁 Feature modules:"
          ls -la feature/

      - name: Build Debug APK
        run: |
          ./gradlew :app:assembleDebug --no-daemon --stacktrace \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WorldMondial-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Show Build Summary
        if: always()
        run: |
          echo "📊 Build finished."
          if [ -d "app/build/outputs/apk/debug" ]; then
            ls -lh app/build/outputs/apk/debug/
          fi
