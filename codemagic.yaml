workflows:
  android-debug:
    name: Build Android Debug APK
    max_build_duration: 45
    instance_type: linux_x1

    environment:
      java: 17

    cache:
      cache_paths:
        - ~/.gradle/caches
        - ~/.gradle/wrapper

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Make Gradle executable
        script: chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk
