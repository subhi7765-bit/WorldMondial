workflows:
  android-debug:
    name: Build Android Debug APK
    max_build_duration: 45

    environment:
      vars:
        JAVA_VERSION: "17"

    triggering:
      events:
        - push
      when:
        branch: main

    scripts:
      - name: Make Gradle executable
        script: chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk
