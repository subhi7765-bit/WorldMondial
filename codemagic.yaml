workflows:
  android-debug:
    name: Build Android Debug APK
    instance_type: mac_mini_m2
    max_build_duration: 45

    environment:
      vars:
        JAVA_VERSION: "17"

    triggering:
      events:
        - push
      branch_mode: "MATCH"
      branch_list:
        - main

    scripts:
      - name: Checkout code
        script: |
          git clone $CM_REPO_URL .
          git checkout $CM_COMMIT

      - name: Make Gradle executable
        script: chmod +x gradlew

      - name: Build Debug APK
        script: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - your-email@gmail.com   # غيرها بإيميلك
